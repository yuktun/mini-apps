no{background:#fff0f2;color:#982534}.hidden{display:none!important}.token-area{min-height:75px;border:2px dashed #cbd5e1;border-radius:15px;padding:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:14px}.token{border:1px solid #b8cada;background:#edf5fb;color:#17324d;border-radius:11px;padding:9px 12px;font-size:18px;font-weight:850;cursor:pointer}.quiz-choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:14px;border-radius:13px;margin:9px 0;font-size:17px;cursor:pointer}.quiz-choice.correct{background:#e8f8f0;border-color:#8bcbae}.quiz-choice.wrong{background:#fff0f2;border-color:#e6a1aa}.modal{position:fixed;inset:0;background:#0f172a8f;display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-card{max-width:650px;width:100%;background:#fff;border-radius:22px;padding:23px;box-shadow:0 20px 60px #0005}.modal-card h2{color:#17324d;font-size:27px;margin:0 0 5px}.warning{background:#fff8e6;border:1px solid #f3d28b;color:#714c06;border-radius:14px;padding:13px;line-height:1.55;margin-top:16px}

</style></head><body><a class="home-fab" href="index.html">⌂ <span>首頁</span></a><main class="app"><section class="hero"><h1>💬 會話應用練習</h1><p>第9–12課會話應用練習。根據練習題情境，準確說出或寫出解答例中的完整句子。</p></section><div class="warning">部分答案包含括號中的可省略字詞，例如「（を）」「（い）」「（もう一度）」。本頁會顯示原解答格式，精確默寫亦會接受課本列出的合理變體。</div><nav class="tabs" id="tabs"></nav><section class="toolbar"><div class="filter-group" id="sessions"></div><div id="savedText"></div></section><section id="content"></section></main><div id="modal" class="modal hidden"><div class="modal-card"><button class="btn secondary" style="float:right" onclick="closeModal()">關閉</button><div id="modalBody"></div></div></div><script>
const ITEMS=[{"id": "9-1", "session": 1, "lesson": 9, "title": "パソコンに条件を付け加える", "cue": "店員：このパソコンはいかがでしょうか。画面が見やすいですよ。", "answer": "画面が見やすいだけじゃなくて、ビデオも編集できるのがいいんですが。", "zh": "不只是畫面容易觀看，我還想要可以編輯影片的。", "note": "「Aだけじゃなくて、Bも…」表示不只 A，還要加入 B 的條件。", "tokens": ["画面が見やすい", "だけじゃなくて", "ビデオも", "編集できる", "のがいいんですが"]}, {"id": "9-2", "session": 1, "lesson": 9, "title": "ロボットに条件を付け加える", "cue": "店員：このロボットはいかがでしょうか。しっかり留守番をしますよ。", "answer": "留守番をするだけじゃなくて、話したり歌ったりするのがいいんですが。", "zh": "不只是看家，我還想要會說話和唱歌的。", "note": "「～たり～たりする」列舉幾個代表性動作。", "tokens": ["留守番をする", "だけじゃなくて", "話したり", "歌ったりする", "のがいいんですが"]}, {"id": "9-3", "session": 1, "lesson": 9, "title": "違う色の靴を探す", "cue": "同じデザインで違う色の靴を探す。", "answer": "すみません。この靴なんですけど、同じデザインで、赤いのはありませんか。", "zh": "不好意思，關於這雙鞋，有沒有相同設計的紅色款？", "note": "「赤いの」的「の」代替「靴」。", "tokens": ["すみません", "この靴なんですけど", "同じデザインで", "赤いのは", "ありませんか"]}, {"id": "9-4", "session": 1, "lesson": 9, "title": "靴を購入する", "cue": "店員：はい、こちらにございます。", "answer": "あ、これならいいですね。じゃ、これをください。", "zh": "啊，這個就可以了。那麼，請給我這個。", "note": "「これなら」表示若是這個便符合要求。", "tokens": ["あ", "これならいいですね", "じゃ", "これをください"]}, {"id": "9-5", "session": 1, "lesson": 9, "title": "違う花柄のスカートを探す", "cue": "同じサイズで違う柄のスカートを探す。", "answer": "すみません。このスカートなんですけど、同じサイズで、違う花柄のはありませんか。", "zh": "不好意思，關於這條裙，有沒有相同尺寸、不同花卉圖案的款式？", "note": "答案原圖是「違う花柄の」，沒有加入「ほかの」。", "tokens": ["すみません", "このスカートなんですけど", "同じサイズで", "違う花柄のは", "ありませんか"]}, {"id": "9-6", "session": 1, "lesson": 9, "title": "スカートを購入する", "cue": "店員：はい、こちらにございます。", "answer": "あ、これならいいですね。じゃ、これをください。", "zh": "啊，這個就可以了。那麼，請給我這個。", "note": "與買鞋題使用相同的購買回應。", "tokens": ["あ", "これならいいですね", "じゃ", "これをください"]}, {"id": "10-1", "session": 2, "lesson": 10, "title": "プリンターについて確認する", "cue": "同僚：プリンターの電源を切るのを忘れないでくださいね。", "answer": "え？どういうことでしょうか。", "zh": "咦？這是甚麼意思呢？", "note": "對同事使用較禮貌的「どういうことでしょうか」。", "tokens": ["え", "どういうこと", "でしょうか"]}, {"id": "10-2", "session": 2, "lesson": 10, "title": "プリンターを使わなかったと説明する", "cue": "同僚：事務所のプリンターの電源が入ったままでしたよ。", "answer": "え？わたしはプリンターを使いませんでしたけど。", "zh": "咦？可是我沒有使用打印機。", "note": "「けど」留下後續含意，委婉表示事情與自己無關。", "tokens": ["え", "わたしは", "プリンターを", "使いませんでしたけど"]}, {"id": "10-3", "session": 2, "lesson": 10, "title": "マニュアルについて確認する", "cue": "親しい同僚：マニュアルを見たら必ず元のところに戻しといてね。", "answer": "え？どういうこと？", "zh": "咦？甚麼意思？", "note": "面對熟悉同事，使用普通體。", "tokens": ["え", "どういうこと"]}, {"id": "10-4", "session": 2, "lesson": 10, "title": "マニュアルを見なかったと説明する", "cue": "親しい同僚：マニュアル、出したままだったよ。", "answer": "え？わたしはマニュアルを見ていないけど。", "display": "え？わたしはマニュアル（を）見て（い）ないけど。", "accepted": ["え？わたしはマニュアルを見ていないけど。", "え？わたしはマニュアル見てないけど。", "え？わたしはマニュアルを見てないけど。", "え？わたしはマニュアル見ていないけど。"], "zh": "咦？可是我沒有看過那本說明書。", "note": "答案中的「（を）」「（い）」表示口語可省略；默寫會接受四種組合。", "tokens": ["え", "わたしは", "マニュアルを", "見ていないけど"]}, {"id": "10-5", "session": 2, "lesson": 10, "title": "歌舞伎を見て驚く", "cue": "近所の人：あの人は本当は女じゃなくて男の人なんですよ。", "answer": "え、本当ですか。てっきり女の人だと思ってました。本当にきれいですね。", "zh": "咦，真的嗎？我一直以為是女人。真的很漂亮呢。", "note": "「てっきり～と思ってました」表示本來深信，但後來發現錯了。", "tokens": ["え、本当ですか", "てっきり", "女の人だと", "思ってました", "本当にきれいですね"]}, {"id": "10-6", "session": 2, "lesson": 10, "title": "ごみ箱だと思い込んでいた", "cue": "管理人：これは新聞を入れる箱ですよ。", "answer": "え、本当ですか。てっきりごみ箱だと思ってました。すみませんでした。", "zh": "咦，真的嗎？我一直以為那是垃圾箱。對不起。", "note": "誤會被糾正後，以「すみませんでした」道歉。", "tokens": ["え、本当ですか", "てっきり", "ごみ箱だと", "思ってました", "すみませんでした"]}, {"id": "11-1", "session": 3, "lesson": 11, "title": "忘れ物をしない方法を提案する", "cue": "先輩：乗り物に乗ると、よく忘れ物をするんだ。", "answer": "それは困りますね。降りる前に指をさしてもう一度荷物を確認するっていうのはどうですか。", "display": "それは困りますね。降りる前に指をさして（もう一度）荷物を確認するっていうのはどうですか。", "accepted": ["それは困りますね。降りる前に指をさしてもう一度荷物を確認するっていうのはどうですか。", "それは困りますね。降りる前に指をさして荷物を確認するっていうのはどうですか。"], "zh": "那很困擾呢。下車前指着行李再確認一次，怎麼樣？", "note": "「もう一度」在答案中以括號表示可加入；默寫接受有或沒有。", "tokens": ["それは困りますね", "降りる前に", "指をさして", "もう一度", "荷物を確認する", "っていうのはどうですか"]}, {"id": "11-2", "session": 3, "lesson": 11, "title": "乗り物に酔わない方法を提案する", "cue": "友達：バスに乗ると、すぐ酔っちゃうんだ。", "answer": "それは困るね。乗る前に薬を飲むっていうのはどう？", "zh": "那很麻煩呢。上車前吃藥，怎麼樣？", "note": "對朋友使用普通體「困るね」「どう？」。", "tokens": ["それは困るね", "乗る前に", "薬を飲む", "っていうのはどう"]}, {"id": "11-3", "session": 3, "lesson": 11, "title": "スピーチのテーマにコメントする", "cue": "後輩：スピーチのテーマ、ごみ問題にしようかなと思うんですけど。", "answer": "それも悪くないけど……。だれでも選びそうなテーマだね。", "zh": "那也不壞，不過……似乎是任何人都會選的題目呢。", "note": "先溫和肯定，再指出顧慮。", "tokens": ["それも悪くないけど", "だれでも", "選びそうな", "テーマだね"]}, {"id": "11-4", "session": 3, "lesson": 11, "title": "別のスピーチテーマを提案する", "cue": "後輩：何かいいアイディアはないでしょうか。", "answer": "「わたしの整理法」なんてどう。", "zh": "「我的整理方法」之類的怎麼樣？", "note": "「～なんてどう」用來輕鬆提出例子或建議。", "tokens": ["わたしの整理法", "なんてどう"]}, {"id": "11-5", "session": 3, "lesson": 11, "title": "髪の色にコメントする", "cue": "友達：今度、髪を黄色に染めようと思うんだけど、……。", "answer": "それも悪くないけど……。ちょっと派手じゃない。", "zh": "那也不壞，不過……會不會有點太鮮艷？", "note": "對朋友使用普通體，以否定問句柔和表達顧慮。", "tokens": ["それも悪くないけど", "ちょっと", "派手じゃない"]}, {"id": "11-6", "session": 3, "lesson": 11, "title": "別の髪の色を勧める", "cue": "友達：何かいい色ないかな。", "answer": "明るい茶色なんてどう？", "zh": "亮棕色之類的怎麼樣？", "note": "以「なんてどう？」提出另一個選項。", "tokens": ["明るい茶色", "なんてどう"]}, {"id": "12-1", "session": 4, "lesson": 12, "title": "授業を理由に遅刻を説明する", "cue": "店長：店は5時からですから、30分前には来て、準備するようにしてください。", "answer": "すみません。授業が4時半まであるので、どうしても4時半は過ぎてしまうんです。", "zh": "對不起，因為課堂到四點半，所以無論如何都會超過四點半。", "note": "原題是「30分前」，Gemini 版誤寫成「30日前」。答案按解答例保留「4時半は過ぎてしまう」。", "tokens": ["すみません", "授業が4時半まであるので", "どうしても", "4時半は過ぎてしまうんです"]}, {"id": "12-2", "session": 4, "lesson": 12, "title": "論文を理由に依頼を断る", "cue": "留学生会の会長：留学生会の次の会長を引き受けてもらえませんか。", "answer": "すみません。今年中に論文を書かなければならないので、どうしても会長は引き受けられないんです。", "zh": "對不起，因為今年內必須寫完論文，所以無論如何也不能接任會長。", "note": "「～なければならないので」交代理由；「どうしても～られない」表示實在無法。", "tokens": ["すみません", "今年中に論文を", "書かなければならないので", "どうしても", "会長は引き受けられないんです"]}, {"id": "12-3", "session": 4, "lesson": 12, "title": "自治会役員を依頼する", "cue": "自治会役員を頼まれた人に、丁寧に依頼する。", "answer": "自治会役員を引き受けていただけませんか。", "zh": "可否請您接任自治會幹事？", "note": "「～ていただけませんか」是很有禮貌的請求。", "tokens": ["自治会役員を", "引き受けて", "いただけませんか"]}, {"id": "12-4", "session": 4, "lesson": 12, "title": "相手の事情を認めながら再交渉する", "cue": "相手：すみません。自治会役員はちょっと……。仕事をしているし、まだ小さい子どももいるものですから。", "answer": "それはわかりますけど、ほかの人もいろいろ事情がありますから……。", "zh": "這我明白，不過其他人也有各種情況……", "note": "原文是「仕事をしているし」，不是 Gemini 版的「仕事を強いているし」。", "tokens": ["それはわかりますけど", "ほかの人も", "いろいろ事情がありますから"]}, {"id": "12-5", "session": 4, "lesson": 12, "title": "貸したDVDを返すよう頼む", "cue": "友達に、以前貸したDVDを早く返してほしい。", "answer": "このあいだ貸したDVD、早く返してくれない？", "zh": "之前借給你的 DVD，可不可以快點還給我？", "note": "對朋友使用「～てくれない」作較直接但仍帶詢問語氣的請求。", "tokens": ["このあいだ貸したDVD", "早く", "返してくれない"]}, {"id": "12-6", "session": 4, "lesson": 12, "title": "理由を理解しながら再度頼む", "cue": "友達：遅くなってごめん。おもしろくて何回も見てたもんだから。", "answer": "それはわかるけど、ぼくもまた見たいから……。", "zh": "這我明白，不過我也想再看……", "note": "先表示理解，再交代自己仍需要對方歸還的理由。", "tokens": ["それはわかるけど", "ぼくも", "また見たいから"]}], EXERCISES={"1": [{"title": "1-(1) パソコンに条件を付け加える", "lines": [["店員", "このパソコンはいかがでしょうか。画面が見やすいですよ。"], ["客", "【9-1】"], ["店員", "それでしたら、こちらのがよろしいんじゃないでしょうか。"]]}, {"title": "1-(2) ロボットに条件を付け加える", "lines": [["店員", "このロボットはいかがでしょうか。しっかり留守番をしますよ。"], ["客", "【9-2】"], ["店員", "それでしたら、こちらのがよろしいんじゃないでしょうか。"]]}, {"title": "2-(1) 同じデザインで違う色の靴を探す", "lines": [["客", "【9-3】"], ["店員", "はい、こちらにございます。"], ["客", "【9-4】"]]}, {"title": "2-(2) 同じサイズで違う柄のスカートを探す", "lines": [["客", "【9-5】"], ["店員", "はい、こちらにございます。"], ["客", "【9-6】"]]}], "2": [{"title": "1-(1) プリンターを使わなかった", "lines": [["同僚", "プリンターの電源を切るのを忘れないでくださいね。"], ["自分", "【10-1】"], ["同僚", "事務所のプリンターの電源が入ったままでしたよ。"], ["自分", "【10-2】"]]}, {"title": "1-(2) マニュアルを見なかった", "lines": [["親しい同僚", "マニュアルを見たら必ず元のところに戻しといてね。"], ["自分", "【10-3】"], ["親しい同僚", "マニュアル、出したままだったよ。"], ["自分", "【10-4】"]]}, {"title": "2-(1) 歌舞伎を見て驚く", "lines": [["自分", "あの若い女の人、きれいですね。"], ["近所の人", "あの人は本当は女じゃなくて男の人なんですよ。"], ["自分", "【10-5】"]]}, {"title": "2-(2) ごみ箱ではないと知って驚く", "lines": [["自分", "おはようございます。"], ["管理人", "あ、ここにごみを捨てないでください。これは新聞を入れる箱ですよ。"], ["自分", "【10-6】"]]}], "3": [{"title": "1-(1) 忘れ物をしない方法を提案する", "lines": [["先輩", "乗り物に乗ると、よく忘れ物をするんだ。"], ["自分", "【11-1】"], ["先輩", "一度やってみるよ。"]]}, {"title": "1-(2) 乗り物に酔わない方法を提案する", "lines": [["友達", "バスに乗ると、すぐ酔っちゃうんだ。"], ["自分", "【11-2】"], ["友達", "一度やってみるよ。"]]}, {"title": "2-(1) スピーチのテーマにコメントして提案する", "lines": [["後輩", "スピーチのテーマ、ごみ問題にしようかなと思うんですけど。"], ["自分", "【11-3】"], ["後輩", "それもそうですね。何かいいアイディアはないでしょうか。"], ["自分", "【11-4】"]]}, {"title": "2-(2) 髪の色にコメントして別の色を勧める", "lines": [["友達", "今度、髪を黄色に染めようと思うんだけど、……。"], ["自分", "【11-5】"], ["友達", "それもそうだね。何かいい色ないかな。"], ["自分", "【11-6】"]]}], "4": [{"title": "1-(1) 授業を理由に遅刻を説明する", "lines": [["店長", "遅いですね。店は5時からですから、30分前には来て、準備するようにしてください。"], ["自分", "【12-1】"]]}, {"title": "1-(2) 論文を理由に依頼を断る", "lines": [["会長", "留学生会の次の会長を引き受けてもらえませんか。"], ["自分", "【12-2】"]]}, {"title": "2-(1) 自治会役員を引き受けてほしい", "lines": [["自分", "【12-3】"], ["相手", "すみません。自治会役員はちょっと……。仕事をしているし、まだ小さい子どももいるものですから。"], ["自分", "【12-4】"], ["相手", "わかりました。じゃ、お引き受けします。"]]}, {"title": "2-(2) 貸したDVDを早く返してほしい", "lines": [["自分", "【12-5】"], ["友達", "遅くなってごめん。おもしろくて何回も見てたもんだから。"], ["自分", "【12-6】"], ["友達", "うん。わかった。あした持ってくるよ。"]]}]}, KEY='jp_application_practice_v1';let state={tab:'dialogs',session:1,index:0,mastered:{},wrong:{},quiz:[],qIndex:0,selected:false,builder:[],available:[]};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const $=x=>document.getElementById(x);const tabs=[['dialogs','完整練習'],['phrases','解答句子'],['cards','記憶卡'],['quiz','選擇題'],['builder','句子重組'],['typing','精確默寫'],['wrong','錯題重溫']];const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));$('savedText').textContent='進度已自動保存'};const visible=()=>ITEMS.filter(x=>x.session===Number(state.session));const shown=x=>x.display||x.answer;
function renderNav(){$('tabs').innerHTML=tabs.map(([k,t])=>`<button class="tab ${state.tab===k?'active':''}" onclick="setTab('${k}')">${t}</button>`).join('');$('sessions').innerHTML=[1,2,3,4].map(n=>`<button class="chip ${Number(state.session)===n?'active':''}" onclick="setSession(${n})">第${n+8}課</button>`).join('')}
function setTab(t){state.tab=t;state.index=0;state.selected=false;if(t==='quiz')startQuiz();if(t==='builder')startBuilder();render()}function setSession(n){state.session=n;state.index=0;state.selected=false;if(state.tab==='quiz')startQuiz();if(state.tab==='builder')startBuilder();render()}
function render(){renderNav();const c=$('content');if(state.tab==='dialogs')c.innerHTML=dialogHTML();if(state.tab==='phrases')c.innerHTML=phrasesHTML();if(state.tab==='cards')c.innerHTML=cardHTML();if(state.tab==='quiz')c.innerHTML=quizHTML();if(state.tab==='builder')c.innerHTML=builderHTML();if(state.tab==='typing')c.innerHTML=typingHTML(false);if(state.tab==='wrong')c.innerHTML=typingHTML(true);save()}
function marker(text){return text.replace(/【(\d+-\d+)】/g,(m,id)=>{const x=ITEMS.find(i=>i.id===id);return `<span class="highlight" onclick="showDetail('${id}')">${x?shown(x):''}</span>`})}
function dialogHTML(){return `<section class="panel"><div class="badge">第${Number(state.session)+8}課</div>${EXERCISES[state.session].map(e=>`<article class="exercise"><h2>${e.title}</h2>${e.lines.map(([s,t])=>`<div class="line"><div class="speaker">${s}：</div><div class="jp">${marker(t)}</div></div>`).join('')}</article>`).join('')}</section>`}
function phrasesHTML(){return `<section class="panel"><div class="cards">${visible().map(x=>`<article class="phrase-card"><span class="badge">第${x.lesson}課 · ${x.id}</span><div class="phrase">${shown(x)}</div><div class="meaning">${x.zh}</div><div class="note"><b>情境：</b>${x.cue}<br><br><b>重點：</b>${x.note}</div><div class="actions"><button class="btn ${state.mastered[x.id]?'good':'secondary'}" onclick="toggleMaster('${x.id}')">${state.mastered[x.id]?'✓ 已記熟':'標記為已記熟'}</button></div></article>`).join('')}</div></section>`}
function current(list=visible()){if(!list.length)return null;state.index=(state.index+list.length)%list.length;return list[state.index]}
function cardHTML(){const list=visible(),x=current(list);return `<section class="panel studybox"><div class="progress"><span>第${x.lesson}課</span><span>${state.index+1} / ${list.length}</span></div><div class="prompt"><div class="cue">${x.cue}</div><div id="cardAnswer" class="answer hidden"><div class="big">${shown(x)}</div><div class="note">${x.note}</div></div></div><div class="actions"><button id="reveal" class="btn primary" onclick="$('cardAnswer').classList.remove('hidden');this.classList.add('hidden')">顯示日文答案</button><button class="btn bad" onclick="markAndNext('${x.id}',false)">✕ 未記熟</button><button class="btn good" onclick="markAndNext('${x.id}',true)">✓ 已記熟</button></div><div class="actions"><button class="btn secondary" onclick="move(-1)">← 上一句</button><button class="btn secondary" onclick="shuffleItem()">🔀 隨機</button><button class="btn primary" onclick="move(1)">下一句 →</button></div></section>`}
function move(n){state.index+=n;render()}function shuffleItem(){state.index=Math.floor(Math.random()*visible().length);render()}function toggleMaster(id){state.mastered[id]=!state.mastered[id];render()}function markAndNext(id,ok){state.mastered[id]=ok;state.wrong[id]=!ok;state.index++;render()}
function startQuiz(){state.quiz=[...visible()].sort(()=>Math.random()-.5);state.qIndex=0;state.selected=false}function quizHTML(){if(!state.quiz.length)startQuiz();const x=state.quiz[state.qIndex%state.quiz.length];const others=ITEMS.filter(i=>i.session===x.session&&i.id!==x.id).sort(()=>Math.random()-.5).slice(0,3).map(shown);const choices=[shown(x),...others].sort(()=>Math.random()-.5);return `<section class="panel studybox"><div class="progress"><span>選擇符合情境的答案</span><span>${state.qIndex+1} / ${state.quiz.length}</span></div><div class="prompt"><div class="cue">${x.cue}</div><div class="answer">${choices.map(c=>`<button class="quiz-choice" onclick="answerQuiz(this,${JSON.stringify(encodeURIComponent(c))},'${x.id}')">${c}</button>`).join('')}</div><div id="quizFeedback"></div></div></section>`}
function answerQuiz(btn,enc,id){if(state.selected)return;state.selected=true;const ans=decodeURIComponent(enc),x=ITEMS.find(i=>i.id===id),correct=shown(x),ok=ans===correct;document.querySelectorAll('.quiz-choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');state.mastered[id]=ok;state.wrong[id]=!ok;$('quizFeedback').innerHTML=`<div class="feedback ${ok?'ok':'no'}">${ok?'✓ 正確':'✕ 正確答案：'+correct}</div><button class="btn primary" style="margin-top:12px" onclick="nextQuiz()">下一題</button>`;save()}function nextQuiz(){state.qIndex=(state.qIndex+1)%state.quiz.length;state.selected=false;render()}
function startBuilder(){const x=current();state.builder=[];state.available=x.tokens.map((v,i)=>({i,v})).sort(()=>Math.random()-.5)}function builderHTML(){const x=current();if(!state.available.length&&!state.builder.length)startBuilder();return `<section class="panel studybox"><div class="progress"><span>重組句子</span><span>${state.index+1} / ${visible().length}</span></div><div class="prompt"><div class="cue">${x.cue}</div><div class="token-area">${state.builder.length?state.builder.map(t=>`<button class="token" onclick="removeToken(${t.i})">${t.v}</button>`).join(''):'按下方字塊組成句子'}</div><div class="token-area">${state.available.map(t=>`<button class="token" onclick="addToken(${t.i})">${t.v}</button>`).join('')}</div><div id="buildFeedback"></div></div><div class="actions"><button class="btn secondary" onclick="startBuilder();render()">重新排列</button><button class="btn primary" onclick="checkBuilder('${x.id}')">檢查答案</button></div></section>`}
function addToken(i){const p=state.available.findIndex(t=>t.i===i);state.builder.push(state.available.splice(p,1)[0]);render()}function removeToken(i){const p=state.builder.findIndex(t=>t.i===i);state.available.push(state.builder.splice(p,1)[0]);render()}function norm(s){return String(s).normalize('NFKC').replace(/[、。，．！？!?…「」『』（）()\s]/g,'')}function accepted(x){return [x.answer,...(x.accepted||[])].map(norm)}function checkBuilder(id){const x=ITEMS.find(i=>i.id===id),got=norm(state.builder.map(t=>t.v).join('')),ok=accepted(x).includes(got);state.mastered[id]=ok;state.wrong[id]=!ok;$('buildFeedback').innerHTML=`<div class="feedback ${ok?'ok':'no'}">${ok?'✓ 完全正確':'✕ 正確答案：'+shown(x)}</div>${ok?'<button class="btn primary" style="margin-top:12px" onclick="state.index++;startBuilder();render()">下一句</button>':''}`;save()}
function typingHTML(wrongOnly){let list=wrongOnly?ITEMS.filter(x=>state.wrong[x.id]):visible();if(!list.length)return `<section class="panel"><div class="note">${wrongOnly?'目前沒有錯題。答錯的句子會自動加入這裡。':'沒有題目。'}</div></section>`;const x=current(list);return `<section class="panel studybox"><div class="progress"><span>${wrongOnly?'錯題重溫':'精確默寫'}</span><span>${state.index+1} / ${list.length}</span></div><div class="prompt"><div class="cue">${x.cue}</div><div class="sub">${x.zh}</div><div class="answer"><input id="typingInput" class="input" placeholder="請輸入完整日文答案"><div id="typingFeedback"></div></div></div><div class="actions"><button class="btn secondary" onclick="showTyping('${x.id}')">顯示答案</button><button class="btn primary" onclick="checkTyping('${x.id}')">檢查答案</button></div></section>`}
function checkTyping(id){const x=ITEMS.find(i=>i.id===id),ok=accepted(x).includes(norm($('typingInput').value));state.mastered[id]=ok;state.wrong[id]=!ok;$('typingFeedback').innerHTML=`<div class="feedback ${ok?'ok':'no'}">${ok?'✓ 完全正確':'✕ 正確答案：'+shown(x)}</div>`;save()}function showTyping(id){const x=ITEMS.find(i=>i.id===id);$('typingFeedback').innerHTML=`<div class="feedback no">答案：${shown(x)}</div>`}
function showDetail(id){const x=ITEMS.find(i=>i.id===id);$('modalBody').innerHTML=`<span class="badge">第${x.lesson}課</span><h2>${shown(x)}</h2><div class="meaning">${x.zh}</div><div class="note"><b>情境：</b>${x.cue}<br><br><b>重點：</b>${x.note}</div>`;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}render();
</script></body></html>

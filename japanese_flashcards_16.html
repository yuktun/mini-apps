<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17324d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JP Study">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>日語擬聲詞／擬態詞 Flashcards</title>
<style>
:root {
  --blue:#2563eb; --bg:#f8fafc; --text:#1f2937;
  --red:#ef4444; --green:#16a34a;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.app{min-height:100vh;padding:28px 16px 40px;max-width:850px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}
h1{font-size:25px;margin:0;color:#374151}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mode{display:flex;background:white;padding:4px;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 4px #00000010}
.mode button{border:0;background:transparent;padding:10px 15px;border-radius:7px;font-weight:700;color:#4b5563;cursor:pointer}
.mode button.active{background:var(--blue);color:white}
.small-btn{border:1px solid #e5e7eb;background:white;padding:10px 14px;border-radius:8px;font-weight:700;color:#4b5563;cursor:pointer;box-shadow:0 1px 4px #00000010}
.small-btn.active{background:#ede9fe;color:#7c3aed;border-color:#c4b5fd}
.card{min-height:480px;border-radius:28px;box-shadow:0 10px 28px #00000018;cursor:pointer;position:relative;overflow:hidden;transition:.2s}
.card.front{background:#333;color:white}
.card.back{background:white;border:1px solid #e5e7eb}
.card-inner{min-height:480px;padding:28px 38px;display:flex;flex-direction:column}

.jump-box{display:flex;align-items:center;gap:6px;color:#6b7280;font-weight:700}
.jump-input{width:64px;padding:5px 7px;border:1px solid #cbd5e1;border-radius:8px;text-align:center;font:inherit;background:white;color:#111827}
.jump-input:focus{outline:2px solid #93c5fd;border-color:#2563eb}
.jump-go{border:0;background:#2563eb;color:white;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer}
.jump-go:hover{background:#1d4ed8}

.meta{display:flex;justify-content:space-between;color:#9ca3af;font-weight:600}
.badge{font-size:12px;border:1px solid #6b7280;border-radius:6px;padding:4px 8px}
.answer-badge{background:#eff6ff;color:var(--blue);border-color:#bfdbfe;border-radius:999px}
.center{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.question{font-size:clamp(26px,4vw,42px);line-height:1.45;font-weight:700}
.hint{text-align:center;color:#9ca3af;letter-spacing:.18em;font-size:14px}
.answer{width:100%;max-width:610px;text-align:left}
.label{display:block;color:#6b7280;font-size:17px;margin-bottom:7px}
.meaning{font-size:clamp(24px,3.2vw,34px);font-weight:750;line-height:1.35;margin-bottom:25px}
.word{font-size:clamp(44px,7vw,68px);font-weight:800;color:var(--blue);text-align:center;letter-spacing:.08em;margin-bottom:28px}
.example{background:#eff6ff;border:1px solid #dbeafe;border-radius:15px;padding:20px}
.example-title{color:#3b82f6;font-size:13px;font-weight:800;letter-spacing:.18em;margin-bottom:10px}
.jp{font-size:20px;line-height:1.55;margin-bottom:7px}
.zh{font-size:17px;color:#4b5563;line-height:1.5}
.controls{display:grid;grid-template-columns:56px minmax(64px,88px) 52px minmax(64px,88px) 56px;justify-content:center;align-items:center;gap:14px;margin-top:28px}
.btn{border:0;background:white;cursor:pointer;box-shadow:0 2px 8px #00000010;font-weight:800}
.circle{width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);font-size:25px}
.score{height:56px;min-width:88px;border-radius:999px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}
.bad{border:1px solid #fecaca;color:var(--red)}
.good{border:1px solid #bbf7d0;color:var(--green)}
.mark-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);font-size:26px;line-height:1;background:white}.mark-btn.active{background:#fff7d6;border-color:#e5b84b;color:#b7791f}.mark-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}

.review-panel{margin-top:22px;background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0000000d}
.review-title{font-weight:800;color:#374151;margin-bottom:12px;text-align:center}
.review-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.review-btn{border:1px solid #d1d5db;background:white;color:#4b5563;padding:9px 13px;border-radius:999px;font-weight:700;cursor:pointer}
.review-btn.active{background:#eff6ff;color:#2563eb;border-color:#93c5fd}
.review-btn.correct.active{background:#f0fdf4;color:#15803d;border-color:#86efac}
.review-btn.incorrect.active{background:#fef2f2;color:#dc2626;border-color:#fca5a5}
.review-btn.marked.active{background:#fff7d6;color:#9a6700;border-color:#e5b84b}
.review-note{text-align:center;color:#6b7280;font-size:13px;margin-top:10px}

.reset{display:block;margin:25px auto 0;border:0;background:transparent;color:#6b7280;cursor:pointer;font-size:14px}
.progress{margin-top:18px;text-align:center;color:#6b7280;font-size:14px}
@media(max-width:600px){
  .app{padding:18px 12px 30px}
  .card,.card-inner{min-height:430px}
  .card-inner{padding:23px 21px}
  .controls{gap:6px;grid-template-columns:52px minmax(58px,1fr) 48px minmax(58px,1fr) 52px}
  .controls button{min-width:0}.score{width:100%;font-size:17px}.mark-btn{width:48px;height:48px}
}

.home-fab{position:fixed;top:16px;left:16px;z-index:999;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.94);color:#17324d;border:1px solid #dbe4ee;text-decoration:none;font-weight:800;box-shadow:0 8px 24px rgba(15,23,42,.14);backdrop-filter:blur(10px);transition:.18s}
.home-fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.2)}
@media(max-width:600px){.home-fab{top:10px;left:10px;padding:9px 12px;font-size:14px}.app{padding-top:64px!important}}

/* Multiple-choice extension */
.module-nav{display:flex;background:#eef2f7;padding:4px;border:1px solid #dbe3ec;border-radius:12px;gap:4px}
.module-nav button{border:0;background:transparent;padding:10px 14px;border-radius:8px;font-weight:800;color:#526174;cursor:pointer;white-space:nowrap}
.module-nav button.active{background:#17324d;color:#fff;box-shadow:0 2px 7px #00000018}
.quiz-panel{display:none;margin-top:6px}
.quiz-panel.active{display:block}
.quiz-head{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #0000000c}
.quiz-head h2{margin:0 0 8px;color:#334155;font-size:25px}
.quiz-help{margin:0;color:#64748b;line-height:1.65}
.quiz-mode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}.quiz-style-toggle{display:flex;gap:6px;width:max-content;max-width:100%;padding:4px;border:1px solid #dbe3ec;border-radius:11px;background:#eef2f7}.quiz-style-toggle button{min-height:44px;border:0;border-radius:8px;padding:9px 15px;background:transparent;color:#526174;font-weight:800;cursor:pointer}.quiz-style-toggle button.active{background:#2563eb;color:#fff}.instant-random-btn.active{background:#6d28d9;color:#fff;border-color:#8b5cf6}
.lesson-tabs{display:flex;gap:9px;overflow-x:auto;padding:4px 1px 10px;margin-top:16px;scrollbar-width:thin}
.lesson-tab{flex:0 0 auto;border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:999px;padding:9px 15px;font-weight:800;cursor:pointer}
.lesson-tab.active{background:#2563eb;color:#fff;border-color:#2563eb}
.marked-quiz-tab.active{background:#8a6400;color:#fff;border-color:#d6a72f;box-shadow:0 0 0 2px rgba(214,167,47,.2)}
.incorrect-quiz-tab.active{background:#b42332;color:#fff;border-color:#ef6674;box-shadow:0 0 0 2px rgba(239,102,116,.18)}
.quiz-stats{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;color:#64748b;font-weight:700}
.quiz-list{display:grid;gap:14px}
.quiz-question{background:#fff;border:1px solid #e2e8f0;border-radius:19px;padding:18px 20px;box-shadow:0 2px 10px #0000000a;transition:.18s}
.quiz-question.correct{border-color:#86efac;background:#f0fdf4}
.quiz-question.incorrect{border-color:#fca5a5;background:#fff7f7}
.q-meta{font-size:13px;color:#64748b;font-weight:800;margin-bottom:9px}
.q-text{font-size:19px;line-height:1.85;color:#1f2937;white-space:pre-wrap}
.answer-slot{display:inline-flex;align-items:center;justify-content:center;min-width:132px;min-height:44px;margin:3px 5px;padding:7px 15px;border:2px dashed #94a3b8;border-radius:12px;background:#f8fafc;color:#475569;font:inherit;font-weight:800;cursor:pointer;vertical-align:middle}
.answer-slot.filled{border-style:solid;border-color:#60a5fa;background:#eff6ff;color:#1d4ed8}
.answer-slot:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.q-feedback{display:none;margin-top:10px;font-size:14px;font-weight:800}
.quiz-question.correct .q-feedback,.quiz-question.incorrect .q-feedback{display:block}
.quiz-question.correct .q-feedback{color:#15803d}
.quiz-question.incorrect .q-feedback{color:#dc2626}
.quiz-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.quiz-action{border:1px solid #cbd5e1;background:#fff;color:#475569;padding:11px 18px;border-radius:11px;font-weight:800;cursor:pointer}
.quiz-action.primary{background:#2563eb;color:#fff;border-color:#2563eb}
.quiz-action.danger{color:#b91c1c;border-color:#fecaca;background:#fff7f7}
.instant-card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:24px;box-shadow:0 8px 24px #00000010}.instant-head{display:flex;justify-content:space-between;gap:12px;color:#64748b;font-weight:800;margin-bottom:20px}.instant-question{font-size:clamp(20px,3vw,28px);line-height:1.75;color:#1f2937;text-align:center;white-space:pre-wrap;padding:22px 10px}.instant-blank{display:inline-block;min-width:110px;padding:4px 12px;border-bottom:3px solid #60a5fa;color:#1d4ed8;font-weight:900}.instant-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.instant-choice{min-height:58px;border:1px solid #cbd5e1;border-radius:14px;background:#fff;color:#334155;padding:12px;font-size:18px;font-weight:800;cursor:pointer}.instant-choice:disabled{opacity:1;cursor:default}.instant-choice.correct{background:#dcfce7;color:#166534;border-color:#4ade80}.instant-choice.wrong{background:#fee2e2;color:#991b1b;border-color:#f87171}.instant-feedback{display:none;margin-top:18px;padding:17px;border-radius:15px;line-height:1.65}.instant-feedback.show{display:flex;flex-direction:column;gap:4px}.instant-feedback.correct{background:#ecfdf5;color:#166534;border:1px solid #86efac}.instant-feedback.wrong{background:#fff1f2;color:#9f1239;border:1px solid #fda4af}.instant-explanation{margin-top:12px;padding-top:12px;border-top:1px solid currentColor;line-height:1.75}.question-translation{margin-top:10px;padding:12px 14px;border-radius:12px;background:#eff6ff;color:#1e3a5f}.instant-nav{display:grid;grid-template-columns:1fr auto auto 1fr;align-items:center;gap:10px;margin-top:18px}.instant-nav button{min-width:0}.instant-nav button:last-child{justify-self:stretch}.instant-mark-btn{flex:0 0 auto}
.choice-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,8,23,.68);z-index:3000}
.choice-modal.open{display:flex}
.choice-dialog{width:min(900px,100%);max-height:86vh;overflow:auto;background:#17324d;color:#fff;border:1px solid #53708f;border-radius:24px;padding:25px;box-shadow:0 24px 80px rgba(0,0,0,.42)}
.choice-dialog h3{font-size:27px;margin:0 0 20px}
.choice-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.choice-btn{min-height:64px;border:1px solid #6385a7;background:#23415f;color:#fff;border-radius:15px;padding:12px;font-size:18px;font-weight:800;cursor:pointer}
.choice-btn:hover,.choice-btn:focus-visible{background:#315a7f;outline:none;box-shadow:0 0 0 3px #93c5fd}
.choice-footer{display:grid;grid-template-columns:1fr 1fr;gap:13px;border-top:1px solid #3c5873;margin-top:21px;padding-top:20px}
.choice-clear,.choice-cancel{min-height:58px;border-radius:14px;padding:12px;font-size:17px;font-weight:800;cursor:pointer}
.choice-clear{background:#5d1f2f;color:#fff;border:1px solid #b6425c}
.choice-cancel{background:#23344c;color:#fff;border:1px solid #52657c}
html[data-theme="dark"] .module-nav,html[data-theme="dark"] .quiz-head,html[data-theme="dark"] .quiz-question{background:#111c2e;color:#e5edf7;border-color:#334155;box-shadow:none}
html[data-theme="dark"] .quiz-head h2,html[data-theme="dark"] .q-text{color:#f1f5f9}
html[data-theme="dark"] .quiz-help,html[data-theme="dark"] .quiz-stats,html[data-theme="dark"] .q-meta{color:#a9b8ca}
html[data-theme="dark"] .lesson-tab,html[data-theme="dark"] .quiz-action,html[data-theme="dark"] .answer-slot{background:#17243a;color:#dce7f3;border-color:#475569}
html[data-theme="dark"] .lesson-tab.active{background:#2563eb!important;color:#fff!important;border-color:#60a5fa!important;box-shadow:0 0 0 2px rgba(96,165,250,.22)}
html[data-theme="dark"] .marked-quiz-tab.active{background:#6b4f12!important;color:#fde68a!important;border-color:#d6a72f!important;box-shadow:0 0 0 2px rgba(214,167,47,.2)!important}
html[data-theme="dark"] .incorrect-quiz-tab.active{background:#651f2b!important;color:#fecdd3!important;border-color:#e05265!important;box-shadow:0 0 0 2px rgba(224,82,101,.2)!important}
html[data-theme="dark"] .answer-slot.filled{background:#172d50;color:#bfdbfe;border-color:#60a5fa}
html[data-theme="dark"] .quiz-question.correct{background:#12382d;border-color:#237a5c}
html[data-theme="dark"] .quiz-question.incorrect{background:#451d28;border-color:#9f3b50}
html[data-theme="dark"] .quiz-question.correct .q-feedback{color:#a7f3d0}
html[data-theme="dark"] .quiz-question.incorrect .q-feedback{color:#fecdd3}
html[data-theme="dark"] .quiz-style-toggle,html[data-theme="dark"] .instant-card{background:#111c2e;color:#e5edf7;border-color:#334155;box-shadow:none}html[data-theme="dark"] .quiz-style-toggle button{color:#cbd5e1}html[data-theme="dark"] .quiz-style-toggle button.active{background:#2563eb;color:#fff}html[data-theme="dark"] .instant-random-btn.active{background:#6d28d9;color:#fff;border-color:#a78bfa}html[data-theme="dark"] .instant-question{color:#f1f5f9}html[data-theme="dark"] .instant-choice{background:#17243a;color:#eef4fb;border-color:#475569}html[data-theme="dark"] .instant-choice.correct{background:#12382d;color:#a7f3d0;border-color:#237a5c}html[data-theme="dark"] .instant-choice.wrong{background:#451d28;color:#fecdd3;border-color:#9f3b50}html[data-theme="dark"] .instant-feedback.correct{background:#12382d;color:#a7f3d0;border-color:#237a5c}html[data-theme="dark"] .instant-feedback.wrong{background:#451d28;color:#fecdd3;border-color:#9f3b50}html[data-theme="dark"] .question-translation{background:#172d50;color:#dbeafe}
@media(max-width:760px){.choice-grid{grid-template-columns:1fr 1fr}.q-text{font-size:17px}.answer-slot{min-width:118px}.quiz-question{padding:16px}.toolbar,.module-nav{width:100%}.module-nav button{flex:1}}
@media(max-width:600px){.choice-modal{align-items:flex-end;padding:10px 8px 0}.choice-dialog{max-height:calc(100dvh - 18px);border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
@media(max-width:430px){.choice-grid,.instant-choices{grid-template-columns:1fr}.choice-footer{grid-template-columns:1fr}.choice-dialog{padding:20px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.choice-dialog h3{font-size:23px}.instant-card{padding:18px 14px}.instant-nav{gap:6px}.instant-nav .quiz-action{padding:9px 5px;font-size:12px;white-space:nowrap}.instant-nav .instant-mark-btn{width:44px;height:44px;font-size:23px}.quiz-style-toggle{width:100%}.quiz-style-toggle button{flex:1}}

</style>
<script src="theme.js"></script></head>
<body>
<a class="home-fab" href="index.html" aria-label="返回首頁">⌂ <span>首頁</span></a>
<div class="app">
  <div class="top">
    <h1>擬聲詞／擬態詞（16字）</h1>
    <div class="toolbar">
      <div class="module-nav" aria-label="練習模式">
        <button id="flashcardModuleBtn" class="active" type="button">記憶卡</button>
        <button id="quizModuleBtn" type="button">選擇題</button>
      </div>
      <div class="mode" id="flashcardModeControl">
        <button id="forwardBtn" class="active">正向測試</button>
        <button id="reverseBtn">反向測試</button>
      </div>
      <button id="shuffleBtn" class="small-btn">隨機模式</button>
    </div>
  </div>

  <div id="card" class="card front" role="button" tabindex="0" aria-label="點擊翻面">
    <div class="card-inner">
      <div class="meta">
        <div class="jump-box">
          <input id="jumpInput" class="jump-input" type="number" min="1" inputmode="numeric" aria-label="跳到指定生字">
          <span>/ <span id="totalCount"></span></span>
          <button id="jumpGoBtn" class="jump-go" type="button">前往</button>
        </div>
        <span id="sideBadge" class="badge">點擊翻面</span>
      </div>
      <div id="content" class="center"></div>
      <div id="hint" class="hint">查看答案</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn circle" id="prevBtn" title="上一題">←</button>
    <button class="btn score bad" id="wrongBtn">✕ <span id="wrongCount">0</span></button>
    <button class="btn mark-btn" id="markBtn" type="button" data-no-swipe aria-label="標記題目" aria-pressed="false">☆</button>
    <button class="btn score good" id="correctBtn"><span id="correctCount">0</span> ✓</button>
    <button class="btn circle" id="nextBtn" title="下一題">→</button>
  </div>
  <div class="progress" id="progressText"></div>
  <div class="progress">鍵盤：Space 翻面｜← 上一題｜→ 下一題</div>
  <div class="review-panel">
    <div class="review-title">重溫已標記題目</div>
    <div class="review-actions">
      <button id="reviewAllBtn" class="review-btn active">全部題目</button>
      <button id="reviewCorrectBtn" class="review-btn correct">✓ 答對</button>
      <button id="reviewIncorrectBtn" class="review-btn incorrect">✕ 答錯</button>
      <button id="reviewMarkedBtn" class="review-btn marked">★ 已標記</button>
    </div>
    <div id="reviewNote" class="review-note"></div>
  </div>
  <button class="reset" id="resetBtn">↻ 重新開始計算</button>

  <section id="quizPanel" class="quiz-panel" aria-label="擬聲詞擬態詞選擇題">
    <div class="quiz-head">
      <h2>擬聲詞／擬態詞・選擇題</h2>
      <p class="quiz-help">可選擇「整課練習」逐題填寫後一次檢查，或使用「即時答題」在選擇後立即查看答案和解釋。每個選項均來自本模組的 16 個擬聲詞／擬態詞。</p>
      <div class="quiz-mode-row">
        <div class="quiz-style-toggle" aria-label="選擇題作答方式">
          <button id="batchQuizBtn" class="active" type="button">整課練習</button>
          <button id="instantQuizBtn" type="button">即時答題</button>
        </div>
        <button id="instantRandomBtn" class="quiz-action instant-random-btn" type="button" aria-pressed="false">隨機次序：關</button>
      </div>
      <div class="lesson-tabs" id="lessonTabs">
        <button class="lesson-tab" data-lesson="all">全部混合</button>
        <button class="lesson-tab active" data-lesson="9">第9課</button>
        <button class="lesson-tab" data-lesson="10">第10課</button>
        <button class="lesson-tab" data-lesson="11">第11課</button>
        <button class="lesson-tab" data-lesson="12">第12課</button>
        <button id="markedQuizBtn" class="lesson-tab marked-quiz-tab" type="button">★ 已標記（0）</button>
        <button id="incorrectQuizBtn" class="lesson-tab incorrect-quiz-tab" type="button">✕ 答錯（0）</button>
      </div>
      <div class="quiz-stats"><span id="quizCount"></span><span id="quizResult"></span></div>
    </div>
    <div id="quizList" class="quiz-list"></div>
    <div class="quiz-actions">
      <button id="checkQuizBtn" class="quiz-action primary" type="button">檢查全部答案</button>
      <button id="clearQuizBtn" class="quiz-action danger" type="button">重新練習本課</button>
    </div>
  </section>

  <div id="choiceModal" class="choice-modal" role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
    <div class="choice-dialog">
      <h3 id="choiceTitle">選擇答案</h3>
      <div id="choiceGrid" class="choice-grid"></div>
      <div class="choice-footer">
        <button id="choiceClear" class="choice-clear" type="button">清除此答案</button>
        <button id="choiceCancel" class="choice-cancel" type="button">取消</button>
      </div>
    </div>
  </div>
</div>

<script>
const vocabList = [{"word": "さっさと", "meaning": "趕快、乾脆地（不拖泥帶水）", "jp": "佐藤さんは毎日5時になると、さっさと帰る。", "zh": "佐藤先生每天一到五點，就趕快回家。"}, {"word": "さっと", "meaning": "一下子（動作的瞬間之快）", "jp": "猫がさっと逃げた。", "zh": "貓一下子就逃跑了。"}, {"word": "こつこつ", "meaning": "持續努力、孜孜不倦", "jp": "彼女は毎日こつこつ勉強している。", "zh": "她每天孜孜不倦地學習。"}, {"word": "てきぱき", "meaning": "俐落乾脆（有條理且有效）", "jp": "てきぱきやったので、仕事が早く終わった。", "zh": "因為俐落乾脆地做，工作很快就結束了。"}, {"word": "ざっと", "meaning": "粗略地、大概／隨便掃一下", "jp": "朝、新聞をざっと読んだ。", "zh": "早上，粗略地看了一下報紙。"}, {"word": "こっそり", "meaning": "偷偷地、秘密地", "jp": "テストのとき、となりの子の答えをこっそり見た。", "zh": "考試時，偷偷看了旁邊同學的答案。"}, {"word": "そっと", "meaning": "輕輕地、靜靜地、悄悄地", "jp": "子どもが寝ているので、そっと部屋を出た。", "zh": "因為孩子在睡覺，所以靜靜地離開了房間。"}, {"word": "うっかり", "meaning": "一時大意、不小心", "jp": "うっかり宿題を忘れてしまった。", "zh": "不小心忘記了作業。"}, {"word": "どんどん", "meaning": "不停地／一個接一個／快速持續變化", "jp": "お酒はたくさんありますから、どんどん飲んでください。", "zh": "酒還有很多，請不停地喝。"}, {"word": "ぐんぐん", "meaning": "有力地快速成長（身高／植物／能力）", "jp": "この2、3年で、孫の背がぐんぐん伸びた。", "zh": "這兩三年，孫子的身高快速長高了。"}, {"word": "めきめき", "meaning": "顯著地／明顯地進步（技術、病情）", "jp": "林さんのピアノの腕はめきめき上がった。", "zh": "林先生的鋼琴技巧明顯進步了。"}, {"word": "だんだん", "meaning": "漸漸／慢慢地（天氣、感覺、理解）", "jp": "9月になって、だんだん涼しくなってきた。", "zh": "到了九月，天氣漸漸變涼了。"}, {"word": "ばらばら", "meaning": "散亂的、分散的、不一致的", "jp": "卒業のあと、クラスメートはばらばらになった。", "zh": "畢業之後，同學們就分散了。"}, {"word": "めちゃくちゃ", "meaning": "亂七八糟、不堪、毫無道理", "jp": "彼の話はめちゃくちゃで、よくわからない。", "zh": "他的話毫無道理，完全聽不懂。"}, {"word": "ごちゃごちゃ", "meaning": "雜亂無章、堆滿雜物", "jp": "机の上に、いろいろなものがごちゃごちゃ置いてある。", "zh": "桌子上雜亂地放著各種東西。"}, {"word": "くしゃくしゃ", "meaning": "皺巴巴的、揉成的", "jp": "ポケットからくしゃくしゃな千円札が出てきた。", "zh": "從口袋裡掏出了皺巴巴的一千日圓鈔票。"}];
let order = vocabList.map((_, i) => i);
let currentPosition = 0;
let isFlipped = false;
let mode = "forward";
let shuffle = false;
let correctCount = 0;
let incorrectCount = 0;
let statuses = {};
let marked = {};
let retainedMarkedIndex = null;
let reviewFilter = "all";
const STORAGE_KEY = "jp_flashcards_16_v2";

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (saved) {
    if (saved.statuses) statuses = saved.statuses;
    if (saved.marked) marked = saved.marked;
    if (saved.correctCount != null) correctCount = saved.correctCount;
    if (saved.incorrectCount != null) incorrectCount = saved.incorrectCount;
    if (saved.shuffle != null) shuffle = saved.shuffle;
    if (Array.isArray(saved.order) && saved.order.length === vocabList.length) order = saved.order;
    if (saved.currentPosition != null) currentPosition = saved.currentPosition;
    if (saved.mode) mode = saved.mode;
  }
} catch (_) {}

const el = id => document.getElementById(id);

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    order, currentPosition, mode, shuffle, correctCount, incorrectCount, statuses, marked
  }));
}

function filteredIndices() {
  if (reviewFilter === "correct") return order.filter(i => statuses[i] === "correct");
  if (reviewFilter === "incorrect") return order.filter(i => statuses[i] === "incorrect");
  if (reviewFilter === "marked") {
    const list = order.filter(i => marked[i]);
    if (retainedMarkedIndex != null && !list.includes(retainedMarkedIndex)) list.splice(Math.min(currentPosition, list.length), 0, retainedMarkedIndex);
    return list;
  }
  return order;
}

function ensureValidPosition() {
  const list = filteredIndices();
  if (list.length === 0) {
    currentPosition = 0;
    return;
  }
  if (!Number.isInteger(currentPosition) || currentPosition < 0 || currentPosition >= list.length) currentPosition = 0;
}

function render() {
  const visible = filteredIndices();
  ensureValidPosition();
  const currentIndex = visible.length ? visible[currentPosition] : 0;
  const item = vocabList[currentIndex];
  el("jumpInput").value = visible.length ? currentPosition + 1 : "";
  el("jumpInput").max = Math.max(1, visible.length);
  el("totalCount").textContent = visible.length;
  el("shuffleBtn").classList.toggle("active", shuffle);
  el("shuffleBtn").textContent = shuffle ? "隨機模式：開" : "隨機模式";
  el("reviewAllBtn").classList.toggle("active", reviewFilter === "all");
  el("reviewCorrectBtn").classList.toggle("active", reviewFilter === "correct");
  el("reviewIncorrectBtn").classList.toggle("active", reviewFilter === "incorrect");
  el("reviewMarkedBtn").classList.toggle("active", reviewFilter === "marked");
  const correctMarked = Object.values(statuses).filter(v => v === "correct").length;
  const incorrectMarked = Object.values(statuses).filter(v => v === "incorrect").length;
  const manuallyMarked = Object.values(marked).filter(Boolean).length;
  el("reviewCorrectBtn").textContent = `✓ 答對（${correctMarked}）`;
  el("reviewIncorrectBtn").textContent = `✕ 答錯（${incorrectMarked}）`;
  el("reviewMarkedBtn").textContent = `★ 已標記（${manuallyMarked}）`;
  el("reviewNote").textContent = visible.length ? "" : reviewFilter === "marked" ? "暫時沒有已標記題目。" : "這個分類暫時沒有題目。";
  const isMarked = visible.length ? !!marked[currentIndex] : false;
  el("markBtn").textContent = isMarked ? "★" : "☆";el("markBtn").classList.toggle("active",isMarked);el("markBtn").setAttribute("aria-pressed",String(isMarked));
  el("correctCount").textContent = correctCount;
  el("wrongCount").textContent = incorrectCount;
  el("progressText").textContent = `已作答 ${correctCount + incorrectCount} 題｜正確率 ${correctCount + incorrectCount ? Math.round(correctCount/(correctCount+incorrectCount)*100) : 0}%`;

  const card = el("card");
  const content = el("content");
  const badge = el("sideBadge");
  const hint = el("hint");

  card.className = "card " + (isFlipped ? "back" : "front");
  badge.textContent = isFlipped ? "解答" : "點擊翻面";
  badge.className = "badge" + (isFlipped ? " answer-badge" : "");
  hint.style.display = isFlipped ? "none" : "block";

  if (!visible.length) { content.innerHTML = '<p class="question">暫時沒有已標記題目。</p>'; hint.style.display="none"; saveState(); return; }

  if (!isFlipped) {
    const q = mode === "forward"
      ? `日語擬聲／擬態詞「${item.word}」的中文含義與例句？`
      : `中文含義為「${item.meaning.split("（")[0].trim()}」的日語擬聲／擬態詞與例句？`;
    content.innerHTML = `<p class="question">${escapeHtml(q)}</p>`;
  } else {
    if (mode === "forward") {
      content.innerHTML = `
        <div class="answer">
          <span class="label">意思</span>
          <div class="meaning">${escapeHtml(item.meaning)}</div>
          <div class="example">
            <div class="example-title">例文</div>
            <div class="jp">${escapeHtml(item.jp)}</div>
            <div class="zh">${escapeHtml(item.zh)}</div>
          </div>
        </div>`;
    } else {
      content.innerHTML = `
        <div class="answer">
          <span class="label" style="text-align:center">擬聲／擬態詞</span>
          <div class="word">${escapeHtml(item.word)}</div>
          <div class="example">
            <div class="example-title">例文</div>
            <div class="jp">${escapeHtml(item.jp)}</div>
            <div class="zh">${escapeHtml(item.zh)}</div>
          </div>
        </div>`;
    }
  }
  saveState();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function next() {
  retainedMarkedIndex = null;
  const list = filteredIndices();
  isFlipped = false;
  if (list.length) currentPosition = (currentPosition + 1) % list.length;
  render();
}
function prev() {
  retainedMarkedIndex = null;
  const list = filteredIndices();
  isFlipped = false;
  if (list.length) currentPosition = (currentPosition - 1 + list.length) % list.length;
  render();
}
function reshuffle() {
  order = vocabList.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  currentPosition = 0;
}

el("card").addEventListener("click", () => {isFlipped=!isFlipped; render();});
el("card").addEventListener("keydown", e => {if(e.key==="Enter"||e.key===" "){e.preventDefault();isFlipped=!isFlipped;render();}});
el("nextBtn").onclick = next;
el("prevBtn").onclick = prev;
el("markBtn").onclick = () => {const list=filteredIndices();if(!list.length)return;const idx=list[currentPosition];marked[idx]=!marked[idx];retainedMarkedIndex=reviewFilter==="marked"&&!marked[idx]?idx:null;saveState();render()};
setupFlashcardSwipe({element:el("card"),onSwipeLeft:next,onSwipeRight:prev});
el("correctBtn").onclick = () => {
  const list = filteredIndices();
  if (!list.length) return;
  const idx = list[currentPosition];
  const previous = statuses[idx];
  if (previous !== "correct") {
    if (previous === "incorrect") incorrectCount = Math.max(0, incorrectCount - 1);
    correctCount++;
  }
  statuses[idx] = "correct";
  saveState();
  next();
};
el("wrongBtn").onclick = () => {
  const list = filteredIndices();
  if (!list.length) return;
  const idx = list[currentPosition];
  const previous = statuses[idx];
  if (previous !== "incorrect") {
    if (previous === "correct") correctCount = Math.max(0, correctCount - 1);
    incorrectCount++;
  }
  statuses[idx] = "incorrect";
  saveState();
  next();
};
el("resetBtn").onclick = () => {
  correctCount=0; incorrectCount=0; statuses={}; retainedMarkedIndex=null; reviewFilter="all"; currentPosition=0; isFlipped=false;
  order = vocabList.map((_, i) => i);
  if (shuffle) reshuffle();
  render();
};
el("shuffleBtn").onclick = () => {
  shuffle = !shuffle;
  order = vocabList.map((_, i) => i);
  if (shuffle) reshuffle();
  currentPosition = 0;
  isFlipped = false;
  render();
};
el("forwardBtn").onclick = () => {mode="forward";isFlipped=false;el("forwardBtn").classList.add("active");el("reverseBtn").classList.remove("active");render();};
el("reverseBtn").onclick = () => {mode="reverse";isFlipped=false;el("reverseBtn").classList.add("active");el("forwardBtn").classList.remove("active");render();};
function jumpToVocabulary() {
  retainedMarkedIndex = null;
  const list = filteredIndices();
  if (!list.length) return;
  const requested = Number.parseInt(el("jumpInput").value, 10);
  if (!Number.isFinite(requested) || requested < 1 || requested > list.length) {
    alert(`請輸入 1 至 ${list.length} 之間的數字。`);
    el("jumpInput").value = currentPosition + 1;
    return;
  }
  currentPosition = requested - 1;
  isFlipped = false;
  render();
}
el("jumpGoBtn").onclick = jumpToVocabulary;
el("jumpInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); jumpToVocabulary(); }
});

function setReviewFilter(filter){reviewFilter=filter;retainedMarkedIndex=null;currentPosition=0;isFlipped=false;render()}
el("reviewAllBtn").onclick = () => setReviewFilter("all");
el("reviewCorrectBtn").onclick = () => setReviewFilter("correct");
el("reviewMarkedBtn").onclick = () => setReviewFilter("marked");
el("reviewIncorrectBtn").onclick = () => setReviewFilter("incorrect");

document.addEventListener("keydown", e => {
  const tag = document.activeElement?.tagName;
  const isControl = ["BUTTON","INPUT","TEXTAREA","SELECT"].includes(tag);
  if(e.key==="ArrowRight") next();
  else if(e.key==="ArrowLeft") prev();
  else if((e.key===" " || e.code==="Space") && !isControl) {
    e.preventDefault(); isFlipped=!isFlipped; render();
  } else if(e.key==="f"||e.key==="F") {
    isFlipped=!isFlipped; render();
  }
});
render();

  61:"在派對上，最好主動積極地多跟別人交談。", 62:"這位選手在國內並不突出，但加入外國球隊後實力顯著提升，成為代表球隊的選手，令大家都很驚訝。", 63:"暑假期間，身高迅速增長了。", 64:"這種藥不會立即見效，但只要持續服用，皮膚便會漸漸變漂亮。",

};
const QUIZ_STORAGE_KEY = "jp_onomatopoeia_mcq_v1";
let activeModule = "flashcards";
let activeLesson = 9;
let activeQuestionId = null;
let quizChecked = false;
let quizAnswers = {};
let quizStyle = "batch";
let instantPositions = {all:0,9:0,10:0,11:0,12:0};
let instantRandom = false;
let instantOrders = {};
let quizMarked = {};
let quizMarkedOnly = false;
let quizIncorrectOnly = false;
try {
  const savedQuiz = JSON.parse(localStorage.getItem(QUIZ_STORAGE_KEY));
  if (savedQuiz?.answers) quizAnswers = savedQuiz.answers;
  if (savedQuiz?.lesson==="all" || [9,10,11,12].includes(savedQuiz?.lesson)) activeLesson = savedQuiz.lesson;
  if (["batch","instant"].includes(savedQuiz?.style)) quizStyle = savedQuiz.style;
  if (savedQuiz?.instantPositions) instantPositions = {...instantPositions,...savedQuiz.instantPositions};
  if (typeof savedQuiz?.instantRandom === "boolean") instantRandom = savedQuiz.instantRandom;
  if (savedQuiz?.instantOrders && typeof savedQuiz.instantOrders === "object") instantOrders = savedQuiz.instantOrders;
  if (savedQuiz?.marked && typeof savedQuiz.marked === "object") quizMarked = savedQuiz.marked;
  if (typeof savedQuiz?.markedOnly === "boolean") quizMarkedOnly = savedQuiz.markedOnly;
  if (typeof savedQuiz?.incorrectOnly === "boolean") quizIncorrectOnly = savedQuiz.incorrectOnly;
} catch (_) {}
if (quizMarkedOnly && quizIncorrectOnly) quizIncorrectOnly = false;

function saveQuizState() {
  localStorage.setItem(QUIZ_STORAGE_KEY, JSON.stringify({answers:quizAnswers,lesson:activeLesson,style:quizStyle,instantPositions,instantRandom,instantOrders,marked:quizMarked,markedOnly:quizMarkedOnly,incorrectOnly:quizIncorrectOnly}));
}
function seededChoices(question) {
  const pool = quizWords.filter(w => w !== question.answer);
  let seed = question.id * 9301 + 49297;
  const rand = () => { seed = (seed * 233280 + 12345) % 1000003; return seed / 1000003; };
  for (let i=pool.length-1;i>0;i--) { const j=Math.floor(rand()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const choices=[question.answer,...pool.slice(0,3)];
  for (let i=choices.length-1;i>0;i--) { const j=Math.floor(rand()*(i+1)); [choices[i],choices[j]]=[choices[j],choices[i]]; }
  return choices;
}
function switchModule(module) {
  activeModule = module;
  const isQuiz = module === "quiz";
  el("flashcardModuleBtn").classList.toggle("active", !isQuiz);
  el("quizModuleBtn").classList.toggle("active", isQuiz);
  el("quizPanel").classList.toggle("active", isQuiz);
  el("flashcardModeControl").style.display = isQuiz ? "none" : "flex";
  el("shuffleBtn").style.display = isQuiz ? "none" : "inline-block";
  ["card","wrongBtn","markBtn","correctBtn","prevBtn","nextBtn","progressText","reviewAllBtn"].forEach(()=>{});
  document.querySelector(".card").style.display = isQuiz ? "none" : "block";
  document.querySelector(".controls").style.display = isQuiz ? "none" : "grid";
  document.querySelectorAll(".progress").forEach(x => x.style.display = isQuiz ? "none" : "block");
  document.querySelector(".review-panel").style.display = isQuiz ? "none" : "block";
  el("resetBtn").style.display = isQuiz ? "none" : "block";
  document.querySelector("h1").textContent = isQuiz ? "擬聲詞／擬態詞（選擇題）" : "擬聲詞／擬態詞（16字）";
  if (isQuiz) renderQuiz();
}
function questionHtml(q,index) {
  const selected=quizAnswers[q.id] || "";
  const state = (quizChecked || quizIncorrectOnly) ? (selected === q.answer ? "correct" : "incorrect") : "";
  const parts=q.question.split("[[BLANK]]");
  const slot=`<button class="answer-slot ${selected?'filled':''}" type="button" data-question-id="${q.id}">${escapeHtml(selected || '選擇答案')}</button>`;
  const feedback = selected === q.answer ? "✓ 正確" : `✕ 正確答案：${escapeHtml(q.answer)}`;
  return `<article class="quiz-question ${state}" data-q-card="${q.id}">
    <div class="q-meta">第${q.lesson}課・第${index+1}題</div>
    <div class="q-text">${parts.map((p,i)=>escapeHtml(p)+(i<parts.length-1?slot:'')).join('')}</div>
    <div class="q-feedback">${feedback}</div>
  </article>`;
}
function instantExplanation(word) {
  return vocabList.find(item=>item.word===word) || null;
}
function lessonQuizQuestions() {
  return activeLesson==="all" ? quizQuestions : quizQuestions.filter(q=>q.lesson===activeLesson);
}
function isQuizIncorrect(q) {
  return Boolean(quizAnswers[q.id]) && quizAnswers[q.id] !== q.answer;
}
function currentQuizQuestions() {
  const list=lessonQuizQuestions();
  if (quizMarkedOnly) return list.filter(q=>quizMarked[q.id]);
  if (quizIncorrectOnly) return list.filter(isQuizIncorrect);
  return list;
}
function quizEmptyMessage() {
  if (quizMarkedOnly) return "暫時沒有已標記題目。";
  if (quizIncorrectOnly) return "暫時沒有答錯題目。";
  return "這個課次暫時沒有題目。";
}
function shuffledQuestionIds(list) {
  const ids=list.map(q=>q.id);
  for (let i=ids.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [ids[i],ids[j]]=[ids[j],ids[i]];
  }
  if (ids.length>1 && ids.every((id,index)=>id===list[index].id)) [ids[0],ids[1]]=[ids[1],ids[0]];
  return ids;
}
function instantQuestionList(list) {
  if (!instantRandom) return list;
  const validIds=new Set(list.map(q=>q.id));
  let order=Array.isArray(instantOrders[activeLesson])?instantOrders[activeLesson].filter(id=>validIds.has(id)):[];
  if (order.length!==list.length || new Set(order).size!==list.length) {
    order=shuffledQuestionIds(list);
    instantOrders[activeLesson]=order;
  }
  const byId=new Map(list.map(q=>[q.id,q]));
  return order.map(id=>byId.get(id)).filter(Boolean);
}
function renderInstantQuiz(list) {
  if (!list.length) { el("quizList").innerHTML=`<article class="instant-card"><div class="instant-question">${quizEmptyMessage()}</div></article>`; return; }
  let position=Number(instantPositions[activeLesson]) || 0;
  position=Math.max(0,Math.min(position,list.length-1));
  instantPositions[activeLesson]=position;
  const q=list[position];
  const selected=quizAnswers[q.id] || "";
  const answered=Boolean(selected);
  const correct=selected===q.answer;
  const isMarked=Boolean(quizMarked[q.id]);
  const details=instantExplanation(q.answer);
  const parts=q.question.split("[[BLANK]]");
  const sentence=parts.map((part,index)=>escapeHtml(part)+(index<parts.length-1?`<span class="instant-blank">${escapeHtml(selected || "（　）")}</span>`:"")).join("");
  const choices=seededChoices(q).map(word=>{
    let state="";
    if (answered && word===q.answer) state="correct";
    else if (answered && word===selected) state="wrong";
    return `<button class="instant-choice ${state}" type="button" data-word="${escapeHtml(word)}" data-no-swipe ${answered?'disabled':''}>${escapeHtml(word)}</button>`;
  }).join("");
  const feedback=answered?`<div class="instant-feedback show ${correct?'correct':'wrong'}"><strong>${correct?'✓ 正確':'✕ 答錯'}</strong>${correct?'':`<span>正確答案：${escapeHtml(q.answer)}</span>`}</div>
    <div class="instant-explanation"><strong>解釋：${escapeHtml(q.answer)} — ${escapeHtml(details?.meaning || '')}</strong>${details?.jp?`<div>例句：${escapeHtml(details.jp)}</div>`:''}${details?.zh?`<div>例句中文：${escapeHtml(details.zh)}</div>`:''}<div class="question-translation"><strong>本題原句：</strong>${escapeHtml(quizQuestionZh[q.id] || '')}</div></div>`:"";
  el("quizList").innerHTML=`<article class="instant-card">
    <div class="instant-head"><strong>第${q.lesson}課・第${position+1}題</strong><span>${position+1} / ${list.length}</span></div>
    <div class="instant-question">${sentence}</div>
    <div class="instant-choices">${choices}</div>
    ${feedback}
    <div class="instant-nav">
      <button id="instantPrev" class="quiz-action" type="button" ${position===0?'disabled':''}>← 上一題</button>
      <button id="instantMark" class="btn mark-btn instant-mark-btn ${isMarked?'active':''}" type="button" data-no-swipe aria-label="${isMarked?'取消標記題目':'標記題目'}" aria-pressed="${isMarked}">${isMarked?'★':'☆'}</button>
      <button id="instantRetry" class="quiz-action" type="button" ${answered?'':'disabled'}>重新答題</button>
      <button id="instantNext" class="quiz-action primary" type="button" ${position===list.length-1?'disabled':''}>下一題 →</button>
    </div>
  </article>`;
  el("quizList").querySelectorAll(".instant-choice").forEach(btn=>btn.addEventListener("click",()=>{
    quizAnswers[q.id]=btn.dataset.word;
    quizChecked=false;
    renderQuiz();
  }));
  el("instantPrev").addEventListener("click",()=>moveInstant(-1,list.length));
  el("instantNext").addEventListener("click",()=>moveInstant(1,list.length));
  el("instantMark").addEventListener("click",()=>{quizMarked[q.id]=!quizMarked[q.id];saveQuizState();renderQuiz();});
  el("instantRetry").addEventListener("click",()=>{delete quizAnswers[q.id];renderQuiz();});
}
function moveInstant(delta,length) {
  instantPositions[activeLesson]=Math.max(0,Math.min((Number(instantPositions[activeLesson])||0)+delta,length-1));
  renderQuiz();
  el("quizPanel").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderQuiz() {
  document.querySelectorAll(".lesson-tab[data-lesson]").forEach(b=>b.classList.toggle("active",String(b.dataset.lesson)===String(activeLesson)));
  const lessonList=lessonQuizQuestions();
  const lessonMarkedCount=lessonList.filter(q=>quizMarked[q.id]).length;
  const lessonIncorrectCount=lessonList.filter(isQuizIncorrect).length;
  el("markedQuizBtn").classList.toggle("active",quizMarkedOnly);
  el("markedQuizBtn").setAttribute("aria-pressed",String(quizMarkedOnly));
  el("markedQuizBtn").textContent=`★ 已標記（${lessonMarkedCount}）`;
  el("incorrectQuizBtn").classList.toggle("active",quizIncorrectOnly);
  el("incorrectQuizBtn").setAttribute("aria-pressed",String(quizIncorrectOnly));
  el("incorrectQuizBtn").textContent=`✕ 答錯（${lessonIncorrectCount}）`;
  el("batchQuizBtn").classList.toggle("active",quizStyle==="batch");
  el("instantQuizBtn").classList.toggle("active",quizStyle==="instant");
  el("instantRandomBtn").style.display=quizStyle==="instant"?"":"none";
  el("instantRandomBtn").classList.toggle("active",instantRandom);
  el("instantRandomBtn").setAttribute("aria-pressed",String(instantRandom));
  el("instantRandomBtn").textContent=`隨機次序：${instantRandom?'開':'關'}`;
  el("checkQuizBtn").style.display=quizStyle==="batch"?"":"none";
  el("clearQuizBtn").textContent=quizMarkedOnly?(quizStyle==="batch"?"重新練習已標記題目":"清除已標記題目進度"):quizIncorrectOnly?(quizStyle==="batch"?"重新練習答錯題目":"清除答錯題目進度"):(quizStyle==="batch"?(activeLesson==="all"?"重新練習全部課次":"重新練習本課"):(activeLesson==="all"?"清除全部課次進度":"清除本課進度"));
  const list=currentQuizQuestions();
  const answered=list.filter(q=>quizAnswers[q.id]).length;
  const markedCount=list.filter(q=>quizMarked[q.id]).length;
  el("quizCount").textContent=quizMarkedOnly?`已標記題目共 ${list.length} 題｜已回答 ${answered} 題`:quizIncorrectOnly?`答錯題目共 ${list.length} 題｜已回答 ${answered} 題`:`${activeLesson==="all"?'全部課次':'本課'}共 ${list.length} 題｜已回答 ${answered} 題｜已標記 ${markedCount} 題`;
  if (quizStyle==="instant") {
    renderInstantQuiz(instantQuestionList(list));
    const correct=list.filter(q=>quizAnswers[q.id]===q.answer).length;
    el("quizResult").textContent=answered?`目前：答對 ${correct} / 已回答 ${answered}`:"";
    saveQuizState();
    return;
  }
  el("quizList").innerHTML=list.length?list.map(questionHtml).join(""):`<article class="quiz-question"><div class="q-text">${quizEmptyMessage()}</div></article>`;
  if (quizChecked) {
    const correct=list.filter(q=>quizAnswers[q.id]===q.answer).length;
    el("quizResult").textContent=`結果：${correct} / ${list.length}`;
  } else el("quizResult").textContent="";
  el("quizList").querySelectorAll(".answer-slot").forEach(btn=>btn.addEventListener("click",()=>openChoiceModal(Number(btn.dataset.questionId))));
  saveQuizState();
}
function openChoiceModal(id) {
  activeQuestionId=id;
  const q=quizQuestions.find(x=>x.id===id);
  if(!q) return;
  el("choiceGrid").innerHTML=seededChoices(q).map(w=>`<button class="choice-btn" type="button" data-word="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join("");
  el("choiceGrid").querySelectorAll(".choice-btn").forEach(btn=>btn.addEventListener("click",()=>{quizAnswers[id]=btn.dataset.word;quizChecked=false;closeChoiceModal();renderQuiz();}));
  el("choiceModal").classList.add("open");
  document.body.style.overflow="hidden";
  setTimeout(()=>el("choiceGrid").querySelector("button")?.focus(),0);
}
function closeChoiceModal() { el("choiceModal").classList.remove("open");document.body.style.overflow="";activeQuestionId=null; }
el("flashcardModuleBtn").addEventListener("click",()=>switchModule("flashcards"));
el("quizModuleBtn").addEventListener("click",()=>switchModule("quiz"));
el("batchQuizBtn").addEventListener("click",()=>{quizStyle="batch";quizChecked=false;renderQuiz();});
el("instantQuizBtn").addEventListener("click",()=>{quizStyle="instant";quizChecked=false;renderQuiz();});
el("instantRandomBtn").addEventListener("click",()=>{
  instantRandom=!instantRandom;
  instantPositions[activeLesson]=0;
  if (instantRandom) instantOrders[activeLesson]=shuffledQuestionIds(currentQuizQuestions());
  renderQuiz();
});
document.querySelectorAll(".lesson-tab[data-lesson]").forEach(btn=>btn.addEventListener("click",()=>{activeLesson=btn.dataset.lesson==="all"?"all":Number(btn.dataset.lesson);quizMarkedOnly=false;quizIncorrectOnly=false;quizChecked=false;renderQuiz();window.scrollTo({top:0,behavior:'smooth'});}));
el("markedQuizBtn").addEventListener("click",()=>{quizMarkedOnly=!quizMarkedOnly;if(quizMarkedOnly)quizIncorrectOnly=false;instantPositions[activeLesson]=0;quizChecked=false;renderQuiz();});
el("incorrectQuizBtn").addEventListener("click",()=>{quizIncorrectOnly=!quizIncorrectOnly;if(quizIncorrectOnly)quizMarkedOnly=false;instantPositions[activeLesson]=0;quizChecked=false;renderQuiz();});
el("choiceCancel").addEventListener("click",closeChoiceModal);
el("choiceClear").addEventListener("click",()=>{if(activeQuestionId!=null) delete quizAnswers[activeQuestionId];quizChecked=false;closeChoiceModal();renderQuiz();});
el("choiceModal").addEventListener("click",e=>{if(e.target===el("choiceModal")) closeChoiceModal();});
el("checkQuizBtn").addEventListener("click",()=>{quizChecked=true;renderQuiz();const first=document.querySelector('.quiz-question.incorrect');if(first) first.scrollIntoView({behavior:'smooth',block:'center'});});
el("clearQuizBtn").addEventListener("click",()=>{currentQuizQuestions().forEach(q=>delete quizAnswers[q.id]);quizChecked=false;renderQuiz();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&el("choiceModal").classList.contains("open")) closeChoiceModal();});

</script>

.answer{width:100%;max-width:740px;text-align:left;line-height:1.65} .grammar{font-size:clamp(29px,5vw,44px);font-weight:850;color:var(--blue);text-align:center;margin:4px 0 18px} .section{margin-top:15px} .label{font-size:13px;letter-spacing:.12em;font-weight:850;color:#64748b;margin-bottom:5px} .value{font-size:18px} .example{background:#eff6ff;border:1px solid #dbeafe;border-radius:14px;padding:15px;margin-top:14px} .jp{font-size:20px;font-weight:700;line-height:1.55}.grammar-focus{background:#fef08a;color:#713f12;border-radius:4px;padding:0 .08em;box-shadow:inset 0 -2px #eab308}.jp-reading{color:#2563eb;margin-top:6px;font-size:16px;line-height:1.55}.jp-reading span{font-weight:850}.zh{margin-top:6px;color:#4b5563} .note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:11px 13px;color:#9a3412}
.controls{display:grid;grid-template-columns:56px minmax(64px,88px) 52px minmax(64px,88px) 56px;justify-content:center;align-items:center;gap:14px;margin-top:24px} .btn{border:0;background:white;cursor:pointer;box-shadow:0 2px 8px #00000010;font-weight:800} .circle{width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);font-size:25px} .score{height:56px;min-width:88px;border-radius:999px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px} .bad{border:1px solid #fecaca;color:var(--red)} .good{border:1px solid #bbf7d0;color:var(--green)} .mark-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);font-size:26px;background:white}.mark-btn.active{background:#fff7d6;border-color:#e5b84b;color:#b7791f}.mark-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}

@media(max-width:600px){.app{padding:16px 11px 28px} .card,.card-inner{min-height:540px} .card-inner{padding:20px 18px} .controls{gap:6px;grid-template-columns:52px minmax(58px,1fr) 48px minmax(58px,1fr) 52px}.controls button{min-width:0}.score{width:100%;font-size:17px}.mark-btn{width:48px;height:48px} .value{font-size:16px} .jp{font-size:18px}.jp-reading{font-size:15px}}

<div class="top"><h1>期終考試文法（第9–12課）</h1><div class="toolbar"><div class="segment"><button id="sentenceBtn">例句 → 解釋</button><button id="usageBtn">中文用法 → 文法</button></div><button id="shuffleBtn" class="small-btn">隨機模式</button></div></div>
<div class="lesson-filter"><button class="lesson-btn active" data-lesson="all">全部混合</button><button class="lesson-btn" data-lesson="9">第9課</button><button class="lesson-btn" data-lesson="10">第10課</button><button class="lesson-btn" data-lesson="11">第11課</button><button class="lesson-btn" data-lesson="12">第12課</button></div>

<div class="controls"><button class="btn circle" id="prevBtn">←</button><button class="btn score bad" id="wrongBtn">✕ <span id="wrongCount">0</span></button><button class="btn mark-btn" id="markBtn" data-no-swipe aria-label="標記題目" aria-pressed="false">☆</button><button class="btn score good" id="correctBtn"><span id="correctCount">0</span> ✓</button><button class="btn circle" id="nextBtn">→</button></div>
<div class="review-panel"><div class="review-title">重溫已標記題目</div><div class="review-actions"><button id="reviewAllBtn" class="review-btn active">全部題目</button><button id="reviewCorrectBtn" class="review-btn correct">✓ 答對</button><button id="reviewIncorrectBtn" class="review-btn incorrect">✕ 答錯</button><button id="reviewMarkedBtn" class="review-btn marked">★ 已標記</button></div><div id="reviewNote" class="review-note"></div></div><button class="reset" id="resetBtn">↻ 清除進度並重新開始</button>
</div><script>
const cards=[{"lesson": 9, "grammar": "お＋Vます形（去ます）＋です", "usage": "以尊敬語表達對方正在進行的動作、持續狀態，或按語境表示將來／剛完成的動作。", "example": "何をお読みですか。", "translation": "您在讀甚麼？", "connection": "お＋動詞ます形（去ます）＋です", "detail": "相當於「読んでいますか」的尊敬說法。常用來提高對方、上司或客人的動作。部分動詞有特殊尊敬語，不能只套用此形式。", "note": "例：お持ちです／お着きです／お帰りです。"}, {"lesson": 9, "grammar": "特殊尊敬語", "usage": "遇到行く、来る、食べる、着る、寝る、知っている等動詞時，使用固定的尊敬語。", "example": "先生はもうお見えですか。", "translation": "老師已經到了嗎？", "connection": "行く・いる・来る→おいでです／来る→お越しです・お見えです／食べる→お召し上がりです／着る→お召しです／寝る→お休みです／知っている→ご存じです", "detail": "這些是固定形式，考試常要求辨認或改寫。", "note": "「住んでいる」的尊敬語是「お住まいです」。"}, {"lesson": 9, "grammar": "～てもかまわない", "usage": "較鄭重地表示允許、認可；疑問句可用來請求允許。", "example": "ここに座ってもかまいませんか。", "translation": "我可以坐這裡嗎？", "connection": "Vて形／いAくて／なA・Nで＋もかまわない", "detail": "意思與「～てもいい」相近，但語氣較鄭重。也可表示某個選項同樣可以，例如「あしたでもかまいません」。", "note": "請求允許時常用「～てもかまいませんか」。"}, {"lesson": 9, "grammar": "AはBほど～ない", "usage": "比較兩者，表示 A 在某程度上不及 B。", "example": "中国は日本より広いが、ロシアほど広くはない。", "translation": "中國比日本大，但沒有俄羅斯那麼大。", "connection": "AはBほど＋いAくない／なAではない", "detail": "A、B 都具備同一特質，但 A 的程度低於 B。否定形式是重點。", "note": "不要誤寫成肯定句；「ほど」後面通常接否定。"}, {"lesson": 9, "grammar": "思ったほど～ない", "usage": "表示實際程度沒有原先想像、預期或考慮的那麼高。", "example": "料理は思ったほどおいしくなかった。", "translation": "菜餚沒有想像中那麼好吃。", "connection": "V普通形＋ほど＋否定", "detail": "「思ったほど」「考えていたほど」常作比較基準。", "note": "PDF 中「はど」屬排版／辨識問題，正確是「ほど」。"}, {"lesson": 9, "grammar": "～ほどではない", "usage": "表示程度尚未達到某個情況或標準。", "example": "まだコートを着るほどではない。", "translation": "還沒有冷到要穿大衣的程度。", "connection": "N／V普通形＋ほどではない", "detail": "可以省略前面比較句中的形容詞部分，直接表示「未到……程度」。", "note": "常用於程度判斷。"}, {"lesson": 9, "grammar": "～ほど～はない／いない", "usage": "表示沒有比某事物或人物更……，帶最高程度的比較。", "example": "田中さんほど仕事がよくできる人はいません。", "translation": "沒有比田中先生更能幹的人。", "connection": "Xほど＋形容詞修飾的N＋はない／いない", "detail": "物品通常用「ない」，人物通常用「いない」。", "note": "與「AはBほど～ない」不同：本句表示最高級。"}, {"lesson": 9, "grammar": "～ために／～ためだ（原因）", "usage": "以較正式、偏書面的方式表示原因或理由。", "example": "大雪が降ったために、空港が使えなくなりました。", "translation": "因為下了大雪，機場無法使用。", "connection": "V普通形／いA／なAな／Nの＋ために", "detail": "比「から／ので」鄭重，常見於新聞、報告和正式文章。先說結果時可用「YのはXためだ」。", "note": "「目的」的ために與此處的「原因」用法不同。"}, {"lesson": 9, "grammar": "～たら／～ば、…た（反事實）", "usage": "假設實際上沒有發生的情況，表達推測、遺憾或與現實相反的結果。", "example": "お金があれば、このパソコンが買えたのに。", "translation": "要是有錢，我就能買這台電腦了，可惜……。", "connection": "Vたら／Vば／いAかったら・ければ／なAだったら・なら＋過去結果", "detail": "句末常配「だろう」「のに」「んですが」等，顯示推測或遺憾。", "note": "要與一般條件「お金があったら、旅行します」區分。"}, {"lesson": 10, "grammar": "～はずだ", "usage": "根據計算、知識、證據或邏輯，表示說話人有強烈把握「應該……」。", "example": "2時に大阪を出発すれば、3時には着くはずだ。", "translation": "如果兩點從大阪出發，應該三點會到。", "connection": "V普通形／いA普通形／なAな／Nの＋はずだ", "detail": "不是單純猜測，而是有根據的判斷。「はず」可像名詞般使用，如「はずなのに」「そのはず」。", "note": "なA與名詞的接續容易出錯。"}, {"lesson": 10, "grammar": "～はずがない／はずはない", "usage": "根據依據作出強烈否定，表示不可能、沒有那種可能。", "example": "今日の試合は負けるはずがない。", "translation": "今天的比賽不可能輸。", "connection": "普通形＋はずがない／はずはない", "detail": "「そんなはずはない」常用來強烈否定對方說法，意思是「不可能是那樣」。", "note": "「おもしろくないはずはない」是雙重否定，表示不可能不好看。"}, {"lesson": 10, "grammar": "～はずだった", "usage": "表示本來預定、預料或理應如此，但實際結果不同。", "example": "旅行に行くはずだった。しかし、病気で行けなくなった。", "translation": "本來應該去旅行，但因為生病沒去成。", "connection": "普通形＋はずだった", "detail": "重點是原先安排或預期與現實不一致。", "note": "常與「しかし」「が」「のに」等轉折一起出現。"}, {"lesson": 10, "grammar": "～ことが／もある", "usage": "表示某情況有時、偶爾會發生。", "example": "このエレベーターは、たまに止まることがある。", "translation": "這部電梯偶爾會停下來。", "connection": "V辞書形／Vない形／いA／なAな／Nの＋ことが・もある", "detail": "「ことがある」與「こともある」基本意思相近。常配「ときどき」「たまに」。", "note": "不要與「Vたことがある」的經驗用法混淆。"}, {"lesson": 10, "grammar": "～た結果／～の結果", "usage": "表示經過某項動作、調查或討論後得到的結果。", "example": "調査した結果、この町の人口が減っていることがわかりました。", "translation": "調查結果顯示，這個城市的人口正在減少。", "connection": "Vた形／Nの＋結果", "detail": "偏書面語，也常用於新聞、報告和正式說明。", "note": "名詞可直接接「の結果」。"}, {"lesson": 10, "grammar": "～出す", "usage": "表示某動作突然或自然地開始。", "example": "急に雨が降り出した。", "translation": "突然下起雨來。", "connection": "Vます形去ます＋出す", "detail": "常見：泣き出す、動き出す、歩き出す。不能用於建議或請求開始做某事。", "note": "建議／請求要用「始める」，如「読み始めてください」。"}, {"lesson": 10, "grammar": "～始める・～終わる・～続ける", "usage": "表示動作開始、完成或持續。", "example": "5分間走り続けてください。", "translation": "請連續跑五分鐘。", "connection": "Vます形去ます＋始める／終わる／続ける", "detail": "可自由變化時態，例如「降り始めた」「書き終わる」「走り続けた」。", "note": "「～出す」偏突然開始；「～始める」可用於請求或建議。"}, {"lesson": 10, "grammar": "～忘れる", "usage": "表示忘記做某個動作。", "example": "塩を入れ忘れたので、おいしくない。", "translation": "因為忘了放鹽，所以不好吃。", "connection": "Vます形去ます＋忘れる", "detail": "焦點是本來應該做的動作沒有做。", "note": "例：持って来る→持って来忘れる並不自然，通常說「持って来るのを忘れる」。"}, {"lesson": 10, "grammar": "～合う", "usage": "表示多人或多個事物互相進行某個動作。", "example": "困ったときこそ助け合うことが大切だ。", "translation": "越是困難時，互相幫助越重要。", "connection": "Vます形去ます＋合う", "detail": "常見：話し合う、助け合う、認め合う。", "note": "主體通常是複數或具有互相關係。"}, {"lesson": 10, "grammar": "～換える", "usage": "表示更換、切換、轉乘或換一種方式。", "example": "電車からバスに乗り換えた。", "translation": "由電車轉乘巴士。", "connection": "Vます形去ます＋換える", "detail": "常見：入れ換える、切り換える、取り換える、言い換える。", "note": "不同動詞組合後意思會固定化，宜整個詞記憶。"}, {"lesson": 10, "grammar": "～ということになる", "usage": "綜合幾項資訊後，得出「也就是……／意味著……」的結論。", "example": "今夜カレーを食べれば、3日続けて食べたということになる。", "translation": "今晚再吃咖哩，就等於連續吃了三天。", "connection": "普通形＋ということになる", "detail": "不是單純決定，而是由條件或資料推導出的結論。", "note": "常見於計算、規則或條件推論。"}, {"lesson": 11, "grammar": "～てくる／～ていく（漸變）", "usage": "「～てくる」表示從過去逐漸變到現在；「～ていく」表示從現在逐漸變向未來。", "example": "だんだん春らしくなってきました。", "translation": "漸漸有春天的氣息了。", "connection": "Vて形＋くる／いく", "detail": "時間方向是重點：過去→現在用「てくる」，現在→未來用「ていく」。", "note": "不要與移動方向的「帰ってきた」混淆。"}, {"lesson": 11, "grammar": "～たら（どう）？", "usage": "向對方提出直接而自然的建議：「……怎麼樣？」", "example": "薬を飲んで、今日は早く寝たら？", "translation": "吃藥後，今天早點睡怎麼樣？", "connection": "Vた形＋ら（どう）？", "detail": "對下級、晚輩、家人或朋友較自然。更有禮貌可用「～たらいかがですか」。", "note": "語調過強時可能像命令，要留意關係。"}, {"lesson": 11, "grammar": "YよりXほうが～", "usage": "比較兩者，強調 X 比 Y 更符合某個性質或更好。", "example": "漢字は見て覚えるより、書いて覚えるほうが忘れにくい。", "translation": "比起看著記漢字，寫著記更不容易忘。", "connection": "Yより＋Xほうが＋形容／評價", "detail": "可用名詞、動詞、形容詞作比較。不是回答問句時，常有「其實反而是 X」的強調。", "note": "語序是「較差／基準 Y」在前，「較好／重點 X」在後。"}, {"lesson": 11, "grammar": "Nらしい（典型特徵）", "usage": "表示具有某名詞本來應有的特色、風格或典型特徵。", "example": "春らしい色のバッグですね。", "translation": "是很有春天氣息的手提包。", "connection": "N＋らしい＋N／N＋らしい", "detail": "可作定語或謂語。「あなたらしくない」表示不像你的作風。", "note": "這個用法不是傳聞。"}, {"lesson": 11, "grammar": "～らしい（傳聞／推量）", "usage": "表示從別人、報章等取得的消息，或根據跡象作出較有根據的推測。", "example": "新聞によると、中国で大きな地震があったらしい。", "translation": "據報章說，中國好像發生了大地震。", "connection": "V／いA普通形、なA／N（去だ）＋らしい", "detail": "可表示傳聞，也可從聲音、行為等推測。「Nらしい」典型特徵是另一個用法。", "note": "名詞與な形容詞前面不加「だ」。"}, {"lesson": 11, "grammar": "～として", "usage": "表示以某種資格、身份、立場或角度做事或被認識。", "example": "会社の代表として、新しい商品の説明をした。", "translation": "我以公司代表的身份介紹新產品。", "connection": "N＋として", "detail": "常譯作「作為……」「以……身份」。", "note": "「としては」可表示從某立場來看。"}, {"lesson": 11, "grammar": "～ずに（附帶情況／手段）", "usage": "表示不做某動作而進行另一動作，意思接近「～ないで」，較書面。", "example": "辞書を使わずに新聞を読めるようになりたい。", "translation": "我想不用字典也能看報紙。", "connection": "Vない形去ない＋ずに；する→せずに", "detail": "可表示附帶狀態或手段。", "note": "「する」是不規則形式「せずに」。"}, {"lesson": 11, "grammar": "～ず（原因／並列）", "usage": "較書面地表示因為沒有做某事而產生結果，或把否定與肯定兩項並列。", "example": "子どもの熱が下がらず、心配しました。", "translation": "孩子的燒沒有退，所以我很擔心。", "connection": "Vない形去ない＋ず；する→せず", "detail": "原因用法接近「～なくて」。並列時可表示「不做X，而做Y」。", "note": "有無「に」會影響用法：ずに多為附帶情況／手段。"}, {"lesson": 11, "grammar": "～ている（經驗／經歷）", "usage": "表示歷史上曾發生、累積至今的經驗，或過去經歷仍與現在有關。", "example": "この寺はいままで2回、火事で焼けている。", "translation": "這座寺院至今曾兩次被火燒毀。", "connection": "Vて形＋いる", "detail": "常與次數或期間詞一起使用。也可說某人過去有經歷，而該經歷解釋現在狀況。", "note": "不同於正在進行、結果狀態或習慣的「ている」。"}, {"lesson": 11, "grammar": "～なんかどう？", "usage": "舉出一個可考慮的例子，委婉提出建議，避免把意見強加給對方。", "example": "田中さんなんかいいと思うよ。", "translation": "我覺得田中先生之類的人選不錯。", "connection": "N＋なんかどう？／なんかいい", "detail": "比較正式可用「～などどうですか」。", "note": "口語色彩較強。"}, {"lesson": 12, "grammar": "～もの／もんだから", "usage": "說明個人原因，常帶辯解、解釋或為不理想結果找理由的語氣。", "example": "急いでいたものですから、かぎをかけるのを忘れました。", "translation": "因為太匆忙，所以忘了鎖門。", "connection": "普通形＋もの／もんだから；N・なA＋なものだから", "detail": "不適合單純客觀的因果；客觀原因宜用「から／ので」。「もんだから」較口語。", "note": "常與道歉或說明失誤一起出現。"}, {"lesson": 12, "grammar": "間接被動（自動詞）", "usage": "表示別人的動作或自然現象令說話人受影響、受困擾或受損。", "example": "わたしは雨に降られて、ぬれてしまった。", "translation": "我被雨淋濕了。", "connection": "受影響者は＋原因者／現象に＋自動詞被動形", "detail": "即「迷惑の受身」。自動詞本來沒有直接賓語，但可用被動表達受害感。", "note": "如「父に死なれた」不是父親被殺，而是父親去世令自己受影響。"}, {"lesson": 12, "grammar": "間接被動（他動詞）", "usage": "別人做了某事，令主語受到困擾或損害；焦點不是物件本身，而是受影響的人。", "example": "私は隣の人に家の前にごみを捨てられて困っています。", "translation": "鄰居在我家門前丟垃圾，令我很困擾。", "connection": "受影響者は＋行為者に＋對象を＋他動詞被動形", "detail": "即使直接受影響的物件不是主語，也可用此形式表達受害。", "note": "與普通直接被動不同，常包含負面感受。"}, {"lesson": 12, "grammar": "～たり～たり（交替／多樣）", "usage": "列舉代表性動作，或表示相反狀態反覆、交替出現；也可列舉形容詞或名詞。", "example": "映画を見て、笑ったり泣いたりしました。", "translation": "看電影時一會兒笑、一會兒哭。", "connection": "Vたり／いAかったり／なA・Nだったり＋する", "detail": "第12課重點是交替、反覆和多樣，而不只初級的動作列舉。", "note": "句尾通常要有「する／です」等。"}, {"lesson": 12, "grammar": "～っぱなし", "usage": "做了某動作後，沒有進行本應做的後續處理，讓不理想狀態一直維持。", "example": "ドアが開けっぱなしだよ。早く閉めなさい。", "translation": "門一直開著，快關上。", "connection": "Vます形去ます＋っぱなし", "detail": "多帶責備或負面評價，例如放著不收、開著不關。", "note": "與「たまま」相比，「っぱなし」更強調疏忽和不應持續。"}, {"lesson": 12, "grammar": "～おかげで／おかげだ", "usage": "由於某人或某事的幫助、條件，產生好結果；表示「多虧……」。", "example": "先生のおかげで、研修を受けられることになった。", "translation": "多虧老師，我才有機會接受進修。", "connection": "普通形＋おかげで；なAな／Nの＋おかげで", "detail": "結果通常是正面的，也可直接說「皆様のおかげです」。", "note": "用於人時常帶感謝。"}, {"lesson": 12, "grammar": "～せいで／せいだ", "usage": "表示由於某原因而產生不良結果，帶責怪或負面評價。", "example": "事故のせいで、授業に遅れてしまった。", "translation": "都因為事故，所以上課遲到了。", "connection": "普通形＋せいで；なAな／Nの＋せいで", "detail": "與「おかげで」相反，結果通常不理想。", "note": "對人使用時可能顯得責備很強。"}, {"lesson": 12, "grammar": "～みたいだ（推量）", "usage": "根據眼前狀況作出較口語的判斷，表示「好像……」。", "example": "田中さんはお酒を飲んだみたいです。顔が赤いです。", "translation": "田中先生好像喝了酒，臉很紅。", "connection": "普通形＋みたいだ；なA・N去だ＋みたいだ", "detail": "與「ようだ」意思相近，但「ようだ」較正式、較書面。", "note": "名詞與な形容詞前不加「だ」。"}, {"lesson": 12, "grammar": "どちらかといえば、～ほうだ", "usage": "表示嚴格來說未必完全如此，但相對而言較傾向某一方。", "example": "この店はどちらかといえば、安いほうです。", "translation": "這家店相對來說算是便宜的。", "connection": "どちらかといえば＋普通形＋ほうだ", "detail": "常譯為「比較來說」「算是……的一類」。", "note": "不是絕對判斷，而是相對傾向。"}, {"lesson": 12, "grammar": "～ます／ませんように", "usage": "表達願望、祝福或祈禱，希望某事發生或不要發生。", "example": "どうか大きな地震が起きませんように。", "translation": "希望不要發生大地震。", "connection": "V完整禮貌形（～ます／～ません）＋ように", "detail": "常與「どうか」「どうぞ」一起使用，可用於自言自語祈願或向他人祝福。這裡的「ます」是完整述語，不是去掉「ます」後的動詞詞幹。", "note": "例：合格しますように／風邪をひかれませんように。"}]; const KEY='jp_grammar_09_12_v1';

let state={order:cards.map((_,i)=>i),pos:0,flipped:false,mode:'sentence',shuffle:false,lesson:'all',statuses:{},marked:{},retainedMarkedIndex:null,review:'all'};

const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeRegExp=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function highlightedExample(item){const text=String(item.example),terms=[...new Set(grammarHighlights.get(item.example)||[])].filter(Boolean).sort((a,b)=>b.length-a.length);if(!terms.length)return esc(text);const pattern=new RegExp(terms.map(escapeRegExp).join('|'),'g');let output='',last=0;text.replace(pattern,(match,offset)=>{output+=esc(text.slice(last,offset))+`<mark class="grammar-focus">${esc(match)}</mark>`;last=offset+match.length;return match});return output+esc(text.slice(last))}
function baseIndices(){return state.order.filter(i=>state.lesson==='all'||cards[i].lesson===Number(state.lesson))}

function save(){localStorage.setItem(KEY,JSON.stringify({...state,flipped:false}))}
function currentIndex(){const a=visible();return a.length?a[Math.min(state.pos,a.length-1)]:null}

$('jumpInput').value=a.length?state.pos+1:'';$('jumpInput').max=Math.max(1,a.length);$('totalCount').textContent=a.length;
const vals=Object.values(state.statuses),c=vals.filter(x=>x==='correct').length,w=vals.filter(x=>x==='incorrect').length,mc=Object.values(state.marked).filter(Boolean).length;$('correctCount').textContent=c;$('wrongCount').textContent=w;const done=c+w;$('progressText').textContent=`已標記 ${done} 題｜正確率 ${done?Math.round(c/done*100):0}%｜目前 ${state.lesson==='all'?'全部課堂':'第'+state.lesson+'課'}`;

$('reviewAllBtn').classList.toggle('active',state.review==='all');$('reviewCorrectBtn').classList.toggle('active',state.review==='correct');$('reviewMarkedBtn').classList.toggle('active',state.review==='marked');$('reviewIncorrectBtn').classList.toggle('active',state.review==='incorrect');$('reviewCorrectBtn').textContent=`✓ 答對（${c}）`;$('reviewMarkedBtn').textContent=`★ 已標記（${mc}）`;$('reviewIncorrectBtn').textContent=`✕ 答錯（${w}）`;$('reviewNote').textContent=a.length?'':state.review==='marked'?'暫時沒有已標記題目。':'這個分類暫時沒有題目。';const isMarked=idx!==null&&!!state.marked[idx];$('markBtn').textContent=isMarked?'★':'☆';$('markBtn').classList.toggle('active',isMarked);$('markBtn').setAttribute('aria-pressed',String(isMarked));

function jump(){state.retainedMarkedIndex=null;const a=visible(),n=parseInt($('jumpInput').value,10);if(!a.length)return;if(!Number.isFinite(n)||n<1||n>a.length){alert(`請輸入 1 至 ${a.length} 之間的數字。`);return}state.pos=n-1;state.flipped=false;render()}$('jumpGoBtn').onclick=jump;$('jumpInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();jump()}};

document.addEventListener('keydown',e=>{const t=document.activeElement?.tagName,control=['INPUT','BUTTON','TEXTAREA','SELECT'].includes(t);if(e.key==='ArrowRight'&&!control)move(1);else if(e.key==='ArrowLeft'&&!control)move(-1);else if((e.key===' '||e.code==='Space')&&!control){e.preventDefault();state.flipped=!state.flipped;render()}});render();

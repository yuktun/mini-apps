<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>測驗紀錄</title><style>
*{box-sizing:border-box}:root{--navy:#17324d;--blue:#2563eb;--text:#1f2937;--muted:#64748b;--line:#dbe4ee}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans JP",sans-serif;background:#f5f8fc;color:var(--text)}main{max-width:980px;margin:auto;padding:40px 18px 80px}.home{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--navy);font-weight:850;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px}h1{margin:18px 0 5px;font-size:clamp(30px,6vw,44px);color:var(--navy)}.intro{color:var(--muted);line-height:1.6}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:25px 0 16px}.count{font-weight:800;color:#475569}.danger{border:1px solid #fca5a5;background:#fff;color:#b91c1c;border-radius:12px;padding:10px 14px;font-weight:850;cursor:pointer}.records{display:grid;gap:14px}.record{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 22px #0f172a0b}.record-head{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:start}.record h2{font-size:20px;margin:0 0 6px;color:var(--navy)}.meta{color:var(--muted);line-height:1.55}.score{font-size:26px;font-weight:900;color:var(--blue);text-align:right}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:1px solid var(--line);background:#f8fafc;color:#334155;border-radius:11px;padding:9px 13px;font-weight:800;cursor:pointer}.btn.delete{color:#b91c1c;border-color:#fecaca}.details{display:none;border-top:1px solid var(--line);margin-top:15px;padding-top:15px}.details.open{display:grid;gap:10px}.answer{border:1px solid var(--line);border-left:5px solid #22c55e;border-radius:12px;padding:12px;background:#fbfdff;line-height:1.55}.answer.wrong{border-left-color:#ef4444}.answer strong{color:var(--navy)}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:35px;text-align:center;color:var(--muted)}button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}@media(max-width:520px){main{padding-top:24px}.record-head{grid-template-columns:1fr}.score{text-align:left}.answer{font-size:14px}}html[data-theme="dark"] body{background:#08111f;color:#e5edf7}html[data-theme="dark"] h1,html[data-theme="dark"] .record h2,html[data-theme="dark"] .answer strong{color:#f3f7fb}html[data-theme="dark"] .home,html[data-theme="dark"] .record,html[data-theme="dark"] .empty{background:#111c2e;border-color:#334155;color:#e5edf7}html[data-theme="dark"] .btn{background:#17243a;border-color:#475569;color:#dce7f3}html[data-theme="dark"] .danger,html[data-theme="dark"] .btn.delete{background:#351b24;border-color:#7f3345;color:#fecdd3}html[data-theme="dark"] .answer{background:#142238;border-color:#334155;border-left-color:#237a5c}html[data-theme="dark"] .answer.wrong{border-left-color:#9f3b50}html[data-theme="dark"] .meta,html[data-theme="dark"] .intro,html[data-theme="dark"] .count{color:#a9b8ca}
</style><script src="quiz_history.js"></script><script src="theme.js"></script></head><body><main><a class="home" href="index.html">⌂ 首頁</a><h1>🗂️ 測驗紀錄</h1><div class="intro">查看每次已完成的測驗，包括分數及逐題答案。刪除紀錄不會影響各模組目前的學習進度、錯題或標記。</div><div class="toolbar"><div class="count" id="count"></div><button class="danger" id="clearAll" type="button">清除全部紀錄</button></div><div class="records" id="records"></div></main><script>
const recordsEl=document.getElementById('records'),countEl=document.getElementById('count'),clearBtn=document.getElementById('clearAll');const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));function formatDate(value){try{return new Intl.DateTimeFormat('zh-HK',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}catch(_){return value}}
function render(){const list=QuizHistory.read();countEl.textContent=`共 ${list.length} 次已完成測驗`;clearBtn.disabled=!list.length;if(!list.length){recordsEl.innerHTML='<div class="empty">暫時沒有測驗紀錄。完成測驗後，紀錄會顯示在這裡。</div>';return}recordsEl.innerHTML=list.map(item=>`<article class="record"><div class="record-head"><div><h2>${esc(item.module)}</h2><div class="meta">${esc(item.mode)}｜${esc(item.lesson)}<br>${esc(formatDate(item.completedAt))}</div></div><div class="score">${item.score} / ${item.total}<br><small>${item.percent}%</small></div></div><div class="actions"><button class="btn review" data-id="${esc(item.id)}" aria-expanded="false">查看答題內容</button><button class="btn delete" data-id="${esc(item.id)}">刪除此紀錄</button></div><div class="details" id="details-${esc(item.id)}">${item.details?.length?item.details.map(d=>`<div class="answer ${d.ok?'':'wrong'}"><strong>${d.ok?'✓':'✕'} 第 ${d.number} 題</strong>${d.question?`<div>${esc(d.question)}</div>`:''}<div>你的答案：${esc(d.selected||'未作答')}</div><div>正確答案：${esc(d.correct||'—')}</div>${d.explanation?`<div>解釋：${esc(d.explanation)}</div>`:''}</div>`).join(''):'<div class="meta">此紀錄只有總分，沒有逐題資料。</div>'}</div></article>`).join('');document.querySelectorAll('.review').forEach(btn=>btn.onclick=()=>{const box=document.getElementById(`details-${btn.dataset.id}`),open=!box.classList.contains('open');box.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));btn.textContent=open?'收起答題內容':'查看答題內容'});document.querySelectorAll('.delete').forEach(btn=>btn.onclick=()=>{if(confirm('確定刪除這次測驗紀錄？')){QuizHistory.remove(btn.dataset.id);render()}})}clearBtn.onclick=()=>{if(confirm('確定清除全部測驗紀錄？此操作不能復原。')){QuizHistory.clear();render()}};render();
</script></body></html>

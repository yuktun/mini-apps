<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#17324d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JP Study"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><title>老師期末最後溫習｜Japanese Study Mini Apps</title><link rel="stylesheet" href="teacher_final_review.css"><script src="theme.js"></script><script src="furigana.js"></script><script src="quiz_history.js"></script><script src="teacher_final_review_data.js"></script></head>
<body><a class="home-fab" href="index.html" aria-label="返回首頁">⌂ <span>首頁</span></a><main class="app"><header class="hero"><h1>🚨 老師期末最後溫習</h1><p>依照老師最後派發的「期末試験前復習問題」整理：助詞及第9–12課重點文法。</p><span class="urgent">最後衝刺・獨立進度</span></header>

<section id="setup" class="panel"><div class="setup-grid">
  <div><label for="sectionSelect">範圍</label><select id="sectionSelect"><option value="all">全部（助詞＋文法）</option><option value="particle">助詞 1–10</option><option value="grammar">文法 1–12</option></select></div>
  <div><label for="modeSelect">模式</label><select id="modeSelect"><option value="quick">快速溫習</option><option value="practice">練習模式（即時解釋）</option><option value="exam">模擬考試（最後評分）</option><option value="wrong">錯題重溫</option><option value="marked">已標記題目</option></select></div>
  <div><label for="countSelect">題目數量</label><select id="countSelect"><option value="10">10題</option><option value="all" selected>全部適用題目</option></select></div>
  <div class="check-row"><input id="randomCheck" type="checkbox"><label for="randomCheck">隨機次序</label></div>
</div><div class="actions"><button id="startButton" class="primary" type="button">開始</button><button id="resetButton" class="danger" type="button">重設此模組進度</button></div><div id="savedInfo" class="setup-note"></div></section>

<section id="quiz" class="panel hidden" aria-live="polite"><div class="stats"><span id="progressText"></span><div id="statPills" class="stat-pills"></div></div><div class="navigator"><div class="jump"><span>跳至</span><input id="jumpInput" type="number" min="1" inputmode="numeric" aria-label="題目編號"><button id="jumpButton" class="secondary" type="button">前往</button></div><input id="rangeInput" class="range" type="range" min="1" max="1" value="1" aria-label="切換題目"></div><div class="qhead"><div id="meta" class="meta"></div><button id="markButton" class="mark" type="button" aria-label="標記題目" aria-pressed="false">☆</button></div><div id="instruction" class="instruction"></div><div id="questionArea"></div><div id="feedbackArea"></div><div id="questionActions" class="question-actions"></div><div class="nav"><button id="quitButton" class="secondary" type="button">結束</button><button id="prevButton" class="secondary" type="button">← 上一題</button><button id="nextButton" class="secondary" type="button">下一題 →</button><button id="submitButton" class="primary hidden" type="button">提交試卷</button></div></section>

<section id="results" class="panel results hidden"><h2>測驗結果</h2><div id="scoreText" class="score"></div><div id="resultSummary"></div><div id="breakdown" class="breakdown"></div><div class="actions"><button id="retryButton" class="primary" type="button">再做一次</button><button id="wrongButton" class="secondary" type="button">重溫錯題</button><button id="toggleReviewButton" class="secondary" type="button" aria-expanded="false">查看逐題結果</button></div><div id="reviewList" class="review-list hidden"></div></section>

<p class="footer-note">資料來源：老師派發的「期末試験前復習問題」兩頁。開放式題目以受控示範答案練習，並在解釋中清楚標示。</p></main><script src="teacher_final_review.js"></script></body></html>

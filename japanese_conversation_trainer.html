受影響的鄰居道歉。", "note": "標準、正式的致歉表達。", "tokens": ["ご迷惑", "を", "かけて", "すみませんでした"]}], DIALOGS={"9": [["店員", "電子辞書をお探しですか。"], ["ミラー", "ええ。日本語の勉強に使うんですが……。ことばの意味と漢字の読み方を調べたいんです。"], ["店員", "それでしたら、このフラット社のがいいと思いますよ。今よく売れてますし。"], ["ミラー", "さっきあちらのキャロン社のを見てたんですが、そのフラット社のと【9-1】。"], ["店員", "そうですね。いちばんの違いは漢字の検索方法ですね。"], ["ミラー", "でも、そのフラット社のは例文が少ないですね。意味の説明【9-2】、例文がたくさん載っているのが欲しいんです。【9-3】。"], ["店員", "それでしたら、トップ社のがよろしいんじゃないでしょうか。"], ["ミラー", "そうですか。そのトップ社の【9-4】はフラット社のと【9-5】。"], ["店員", "ほとんど変わりませんね。書き込み検索もできるし、ジャンプ機能もあるし。"], ["ミラー", "そうですか。【9-6】、ほかの色はありませんか。"], ["店員", "はい、こちらにいろいろございます。"], ["ミラー", "じゃ、そのシルバーのにします。"], ["店員", "ありがとうございます。"]], "10": [["管理人", "おはようございます。"], ["ワット", "あ、管理人さん、おはようございます。"], ["管理人", "自転車は、階段の前に置いてはいけないことになってるんですよ。"], ["ワット", "ええ、知ってますけど、……。"], ["管理人", "階段の前に置いてある自転車、ワットさんのでしょ？"], ["ワット", "え？違いますよ。【10-1】。"], ["管理人", "ワットさんの、確か赤い自転車でしたよね。１週間前からずっと置いてありますよ。"], ["ワット", "え？【10-2】。わたしのは、今、自転車屋に修理に出してありますけど。"], ["管理人", "え？そうですか。赤いから、【10-3】ワットさんのだと思って……。"], ["ワット", "赤い自転車に乗ってる人なんてたくさんいますよ。"], ["管理人", "そうですね。申し訳ない。気を悪くしないでください。"], ["ワット", "いえ、【10-4】。"]], "11": [["カリナ", "暑くなってきましたね。"], ["山田一郎", "そうだね。夏休みはどこか行くの？"], ["カリナ", "ええ。いろいろ考えてるんですが、【11-1】。"], ["山田一郎", "そうだなあ。ちょっと遠いけど、【11-2】"], ["カリナ", "沖縄ですか。"], ["山田一郎", "沖縄の海は青くて、すばらしいよ。世界遺産の首里城なんかも見る価値があるし。"], ["カリナ", "【11-3】。あのう、北海道なんかどうかなと思ってたんですが。"], ["山田一郎", "北海道もいいね。涼しくて。でも、北海道へ行くなら、やっぱり冬のほうがいいな。"], ["カリナ", "【11-4】。けど、北海道も沖縄も高そうですね。"], ["山田友子", "パックツアーを【11-5】個人で行くよりずっと安いですよ。"], ["カリナ", "じゃ、帰りに旅行会社に寄って、調べてみます。"]], "12": [["管理人", "あ、ミラーさん、お帰りなさい。あれ、雨ですか。"], ["ミラー", "ええ。途中で降られてしまいました。"], ["管理人", "下の野村さんから苦情があってね。夜遅く、洗濯機の音が聞こえて寝られないそうですよ。"], ["ミラー", "えっ、【12-1】。【12-2】。野村さんにはわたしからちゃんと謝っておきます。"], ["ミラー", "あのう、管理人さんから洗濯機の音でご迷惑をかけてるって聞いたんですが。"], ["野村", "ああ、そのことですか。"], ["ミラー", "どうもすみませんでした。音が下まで聞こえるとは【12-3】。"], ["野村", "いつもお帰りが遅いみたいですね。"], ["ミラー", "ええ。残業が多いので、掃除や洗濯が【12-4】夜になってしまうんです。"], ["野村", "それはわかりますけど、【12-5】洗濯されるとちょっと……。子どもが寝る時間なので。"], ["ミラー", "すみません。何時ごろまでならよろしいでしょうか。"], ["野村", "できれば10時ごろまでにしてもらえますか。"], ["ミラー", "わかりました。そのころまでに let state={tab:"dialogs",lesson:9,index:0,mastered:{},wrong:{},marked:{},quiz:[],quizResults:{},qIndex:0,selected:null,builder:[],available:[],cardOrder:[],cardFlipped:false,cardShuffle:false,cardReview:"all",retainedMarkedId:null};
try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
state.cardOrder=state.cardOrder||[];state.cardFlipped=false;state.cardShuffle=!!state.cardShuffle;state.marked=state.marked||{};state.cardReview=state.cardReview||"all";state.retainedMarkedId=null;
const tabs=[["dialogs","完整會話"],["phrases","重點句子"],["cards","記憶卡"],["quiz","選擇題"],["builder","句子重組"],["typing","精確默寫"],["wrong","錯題重溫"]];
const $=x=>document.getElementById(x); const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));$("savedText").textContent="進度已自動保存"};
const visible=()=>ITEMS.filter(x=>x.lesson===Number(state.lesson));
function renderNav(){ $("tabs").innerHTML=tabs.map(([k,t])=>`<button class="tab ${state.tab===k?"active":""}" onclick="setTab('${k}')">${t}</button>`).join(""); $("lessons").innerHTML=[9,10,11,12].map(n=>`<button class="chip ${Number(state.lesson)===n?"active":""}" onclick="setLesson(${n})">第${n}課</button>`).join("")}
function setTab(t){state.tab=t;state.index=0;state.selected=null;state.cardFlipped=false;if(t==="cards")resetCardOrder();if(t==="quiz")startQuiz();if(t==="builder")startBuilder();render()}
function setLesson(n){state.lesson=n;state.index=0;state.selected=null;state.cardFlipped=false;if(state.tab==="cards")resetCardOrder();if(state.tab==="quiz")startQuiz();if(state.tab==="builder")startBuilder();render()}
function render(){renderNav();const c=$("content"); if(state.tab==="dialogs")c.innerHTML=dialogHTML();if(state.tab==="phrases")c.innerHTML=phrasesHTML();if(state.tab==="cards"){c.innerHTML=cardHTML();setupCurrentCardSwipe()}if(state.tab==="quiz")c.innerHTML=quizHTML();if(state.tab==="builder")c.innerHTML=builderHTML();if(state.tab==="typing")c.innerHTML=typingHTML(false);if(state.tab==="wrong")c.innerHTML=typingHTML(true);Furigana.apply(c);save()}
function setupCurrentCardSwipe(){setupFlashcardSwipe({element:document.querySelector('.study-flip'),onSwipeLeft:()=>move(1),onSwipeRight:()=>move(-1)})}
function marker(text){return text.replace(/【(\d+-\d+)】/g,(m,id)=>{const it=ITEMS.find(x=>x.id===id);return `<span class="highlight" onclick="showDetail('${id}')">${it?it.phrase:""}</span>`})}
function dialogHTML(){return `<section class="panel"><div class="dialog-title"><h2>第${state.lesson}課 完整會話</h2><span class="badge">點擊黃色底線字句查看解釋</span></div>${DIALOGS[state.lesson].map(([s,t])=>`<div class="line"><div class="speaker">${s}：</div><div class="jp" lang="ja">${marker(t)}</div></div>`).join("")}</section>`}
function phrasesHTML(){return `<section class="panel"><div class="cards">${visible().map(x=>`<article class="phrase-card"><span class="badge">第${x.lesson}課 · ${x.id}</span><div class="phrase" lang="ja">${x.phrase}</div><div class="reading">読み：${x.reading}</div><div class="meaning">${x.zh}</div><div class="note">${x.context}<br><br><b>重點：</b>${x.note}</div><div class="actions"><button class="btn ${state.mastered[x.id]?"good":"secondary"}" onclick="toggleMaster('${x.id}')">${state.mastered[x.id]?"✓ 已記熟":"標記為已記熟"}</button></div></article>`).join("")}</div></section>`}
function current(list=visible()){if(!list.length)return null;state.index=(state.index+list.length)%list.length;return list[state.index]}
function cardList(){const base=visible();if(!state.cardOrder.length||state.cardOrder.some(id=>!base.some(x=>x.id===id)))resetCardOrder();let list=state.cardOrder.map(id=>base.find(x=>x.id===id)).filter(Boolean);if(state.cardReview==="marked"){list=list.filter(x=>state.marked[x.id]);if(state.retainedMarkedId&&!list.some(x=>x.id===state.retainedMarkedId)){const held=base.find(x=>x.id===state.retainedMarkedId);if(held)list.splice(Math.min(state.index,list.length),0,held)}}return list}
function resetCardOrder(){state.cardOrder=visible().map(x=>x.id);if(state.cardShuffle)shuffleArray(state.cardOrder);state.index=0}
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cardHTML(){const list=cardList();if(!list.length)return `<section class="panel studybox"><div class="card-empty">暫時沒有已標記題目。</div><div class="card-review"><button class="btn ${state.cardReview==='all'?'active secondary':'secondary'}" onclick="setCardReview('all')">全部題目</button><button class="btn ${state.cardReview==='marked'?'active secondary':'secondary'}" onclick="setCardReview('marked')">★ 已標記（${Object.values(state.marked).filter(Boolean).length}）</button></div></section>`;const x=current(list),back=state.cardFlipped,isMarked=!!state.marked[x.id];return `<section class="panel studybox"><div class="progress"><span>第${x.lesson}課</span><span>${state.index+1} / ${list.length}</span></div><div class="card-mode"><button class="btn ${state.cardShuffle?'good':'secondary'}" onclick="toggleCardShuffle()">${state.cardShuffle?'🔀 隨機模式：開':'🔀 隨機模式'}</button></div><div class="study-flip ${back?'back':'front'}" role="button" tabindex="0" onclick="flipStudyCard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipStudyCard()}"><div class="flip-label">${back?'解答':'點擊翻面'}</div>${back?`<div class="big" lang="ja">${x.phrase}</div><div class="reading">${x.reading}</div><div class="note">${x.note}</div>`:`<div class="cue">${x.context}</div><div class="sub">${x.zh}</div>`}</div><div class="flashcard-controls"><button class="btn nav" onclick="move(-1)">←</button><button class="btn bad" onclick="markAndNext('${x.id}',false)">✕ 未記熟</button><button class="btn star ${isMarked?'active':''}" data-no-swipe aria-label="標記題目" aria-pressed="${isMarked}" onclick="toggleCardMark('${x.id}')">${isMarked?'★':'☆'}</button><button class="btn good" onclick="markAndNext('${x.id}',true)">✓ 已記熟</button><button class="btn nav" onclick="move(1)">→</button></div><div class="card-review"><button class="btn ${state.cardReview==='all'?'active secondary':'secondary'}" onclick="setCardReview('all')">全部題目</button><button class="btn ${state.cardReview==='marked'?'active secondary':'secondary'}" onclick="setCardReview('marked')">★ 已標記（${Object.values(state.marked).filter(Boolean).length}）</button></div></section>`}
function flipStudyCard(){state.cardFlipped=!state.cardFlipped;render()}function move(n){state.retainedMarkedId=null;state.index+=n;state.cardFlipped=false;render()}function toggleCardShuffle(){state.cardShuffle=!state.cardShuffle;state.retainedMarkedId=null;resetCardOrder();state.cardFlipped=false;render()}function setCardReview(v){state.cardReview=v;state.retainedMarkedId=null;state.index=0;state.cardFlipped=false;render()}function toggleCardMark(id){state.marked[id]=!state.marked[id];state.retainedMarkedId=state.cardReview==="marked"&&!state.marked[id]?id:null;save();render()} function toggleMaster(id){state.mastered[id]=!state.mastered[id];save();render()} function markAndNext(id,ok){state.mastered[id]=ok;state.wrong[id]=!ok;move(1)}
function startQuiz(){state.quiz=[...visible()].sort(()=>Math.random()-.5);state.quizResults={};state.qIndex=0;state.selected=null}
function quizHTML(){if(!state.quiz.length)startQuiz();const x=state.quiz[state.qIndex%state.quiz.length];let others=ITEMS.filter(i=>i.lesson===x.lesson&&i.id!==x.id).sort(()=>Math.random()-.5).slice(0,3).map(i=>i.phrase);const choices=[x.phrase,...others].sort(()=>Math.random()-.5);return `<section class="panel studybox"><div class="progress"><span>選擇正確日文</span><span>${state.qIndex+1} / ${state.quiz.length}</span></div><div class="prompt"><div class="cue">${x.context}</div><div class="sub">${x.zh}</div><div class="answer">${choices.map(c=>`<button class="quiz-choice" lang="ja" onclick="answerQuiz(this,'${encodeURIComponent(c)}','${x.id}')">${c}</button>`).join("")}</div><div id="quizFeedback"></div></div></section>`}
function answerQuiz(btn,enc,id){if(state.selected)return;state.selected=1;const ans=decodeURIComponent(enc),x=ITEMS.find(i=>i.id===id),ok=ans===x.phrase;document.querySelectorAll(".quiz-choice").forEach(b=>{if(b.textContent===x.phrase)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");state.mastered[id]=ok;state.wrong[id]=!ok;state.quizResults[id]={selected:ans,ok};$("quizFeedback").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✓ 正確":"✕ 正確答案："+x.phrase}</div><button class="btn primary" style="margin-top:12px" onclick="nextQuiz()">${state.qIndex===state.quiz.length-1?'完成測驗':'下一題'}</button>`;save()}
function nextQuiz(){if(state.qIndex===state.quiz.length-1){const list=state.quiz,score=list.filter(x=>state.quizResults[x.id]?.ok).length;QuizHistory.record({module:'會話底線句子訓練',moduleId:'conversation-trainer',mode:'選擇題',lesson:`第${state.lesson}課`,score,total:list.length,details:list.map((x,i)=>({number:i+1,question:x.context,selected:state.quizResults[x.id]?.selected||'未作答',correct:x.phrase,ok:Boolean(state.quizResults[x.id]?.ok),explanation:x.note}))});alert('測驗紀錄已保存。');startQuiz();render();return}state.qIndex++;state.selected=null;render()}
function startBuilder(){const x=current();state.builder=[];state.available=x.tokens.map((v,i)=>({i,v})).sort(()=>Math.random()-.5)}
function builderHTML(){const x=current();if(!state.available.length&&!state.builder.length)startBuilder();return `<section class="panel studybox"><div class="progress"><span>重組句子</span><span>${state.index+1} / ${visible().length}</span></div><div class="prompt"><div class="cue">${x.context}</div><div class="sub">${x.zh}</div><div class="token-area">${state.builder.length?state.builder.map(t=>`<button class="token" lang="ja" onclick="removeToken(${t.i})">${t.v}</button>`).join(""):"按下方字塊組成正確句子"}</div><div class="token-area">${state.available.map(t=>`<button class="token" lang="ja" onclick="addToken(${t.i})">${t.v}</button>`).join("")}</div><div id="buildFeedback"></div></div><div class="actions"><button class="btn secondary" onclick="startBuilder();render()">重新排列</button><button class="btn primary" onclick="checkBuilder('${x.id}')">檢查答案</button></div></section>`}
function addToken(i){const p=state.available.findIndex(t=>t.i===i);state.builder.push(state.available.splice(p,1)[0]);render()} function removeToken(i){const p=state.builder.findIndex(t=>t.i===i);state.available.push(state.builder.splice(p,1)[0]);render()}
function checkBuilder(id){const x=ITEMS.find(i=>i.id===id),got=state.builder.map(t=>t.v).join("").replace(/[、。？]/g,""),ok=got===x.phrase.replace(/[、。？]/g,"");state.mastered[id]=ok;state.wrong[id]=!ok;$("buildFeedback").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✓ 完全正確":"✕ 正確答案："+x.phrase}</div>${ok?'<button class="btn primary" style="margin-top:12px" onclick="state.index++;startBuilder();render()">下一句</button>':""}`;save()}
function typingHTML(wrongOnly){let list=wrongOnly?ITEMS.filter(x=>state.wrong[x.id]):visible();if(!list.length)return `<section class="panel"><div class="note">${wrongOnly?"目前沒有錯題。完成其他練習後，答錯的句子會自動出現在這裡。":"沒有題目。"}</div></section>`;const x=current(list);return `<section class="panel studybox"><div class="progress"><span>${wrongOnly?"錯題重溫":"精確默寫"}</span><span>${state.index+1} / ${list.length}</span></div><div class="prompt"><div class="cue">${x.context}</div><div class="sub">${x.zh}</div><div class="answer"><input id="typingInput" class="input" placeholder="請輸入完整日文句子"><div id="typingFeedback"></div></div></div><div class="actions"><button class="btn secondary" onclick="showTyping('${x.id}')">顯示答案</button><button class="btn primary" onclick="checkTyping('${x.id}')">檢查答案</button></div></section>`}
function norm(s){return String(s).normalize("NFKC").replace(/[、。，．！？!?…\s]/g,"")} function checkTyping(id){const x=ITEMS.find(i=>i.id===id),ok=norm($("typingInput").value)===norm(x.phrase);state.mastered[id]=ok;state.wrong[id]=!ok;$("typingFeedback").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✓ 完全正確":"✕ 正確答案："+x.phrase}</div>`;save()} function showTyping(id){const x=ITEMS.find(i=>i.id===id);$("typingFeedback").innerHTML=`<div class="feedback no">答案：${x.phrase}</div>`}
function showDetail(id){const x=ITEMS.find(i=>i.id===id);$("modalBody").innerHTML=`<span class="badge">第${x.lesson}課</span><h2>${x.phrase}</h2><div class="reading">${x.reading}</div><div class="meaning">${x.zh}</div><div class="note"><b>情境：</b>${x.context}<br><br><b>重點：</b>${x.note}</div>`;$("modal").classList.remove("hidden");document.body.style.overflow="hidden";$("modalClose").focus()} function closeModal(){$("modal").classList.add("hidden");document.body.style.overflow=""}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeModal()});
render();
</script></body></html>

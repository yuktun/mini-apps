<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>期終考試生字 Flashcards（69字）</title>
<style>
:root {
  --blue:#2563eb; --purple:#7c3aed; --bg:#f8fafc; --text:#1f2937;
  --red:#ef4444; --green:#16a34a;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.app{min-height:100vh;padding:28px 16px 42px;max-width:820px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:25px;margin:0;color:#374151}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mode-scroll{max-width:100%;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.mode-scroll .segment{width:max-content}.mobile-mode-hint{display:none;color:#64748b;font-size:12px;text-align:right;margin-top:-10px;margin-bottom:10px}
.segment{display:flex;background:white;padding:4px;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 4px #00000010}
.segment button,.small-btn{border:0;background:transparent;padding:10px 14px;border-radius:7px;font-weight:700;color:#4b5563;cursor:pointer}
.segment button.active{background:var(--blue);color:white}
.small-btn{background:white;border:1px solid #e5e7eb;box-shadow:0 1px 4px #00000010}
.small-btn.active{background:#ede9fe;color:var(--purple);border-color:#c4b5fd}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#6b7280;font-size:14px;margin:10px 2px 16px}
.card{min-height:440px;border-radius:28px;box-shadow:0 10px 28px #00000018;cursor:pointer;position:relative;overflow:hidden;transition:.2s}
.card.front{background:#333;color:white}
.card.back{background:white;border:1px solid #e5e7eb}
.card-inner{min-height:440px;padding:28px 38px;display:flex;flex-direction:column}

.jump-box{display:flex;align-items:center;gap:6px;color:#6b7280;font-weight:700}
.jump-input{width:64px;padding:5px 7px;border:1px solid #cbd5e1;border-radius:8px;text-align:center;font:inherit;background:white;color:#111827}
.jump-input:focus{outline:2px solid #93c5fd;border-color:#2563eb}
.jump-go{border:0;background:#2563eb;color:white;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer}
.jump-go:hover{background:#1d4ed8}

.meta{display:flex;justify-content:space-between;color:#9ca3af;font-weight:600}
.badge{font-size:12px;border:1px solid #6b7280;border-radius:6px;padding:4px 8px}
.answer-badge{background:#eff6ff;color:var(--blue);border-color:#bfdbfe;border-radius:999px}
.center{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.question{font-size:clamp(26px,4vw,40px);line-height:1.45;font-weight:700}
.hint{text-align:center;color:#9ca3af;letter-spacing:.18em;font-size:14px}
.answer{font-size:clamp(22px,3vw,34px);line-height:1.75}
.blue{color:var(--blue);font-weight:800}
.purple{color:var(--purple);font-weight:800}
.tip{display:block;margin-top:18px;font-size:18px;color:#e11d48;background:#fff1f2;border:1px solid #fecdd3;padding:13px;border-radius:12px}
.controls{display:grid;grid-template-columns:56px minmax(64px,88px) 52px minmax(64px,88px) 56px;justify-content:center;align-items:center;gap:14px;margin-top:28px}
.btn{border:0;background:white;cursor:pointer;box-shadow:0 2px 8px #00000010;font-weight:800}
.circle{width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);font-size:25px}
.score{height:56px;min-width:88px;border-radius:999px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}
.bad{border:1px solid #fecaca;color:var(--red)}
.good{border:1px solid #bbf7d0;color:var(--green)}
.mark-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);font-size:26px;line-height:1;background:white}.mark-btn.active{background:#fff7d6;border-color:#e5b84b;color:#b7791f}.mark-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}

.review-panel{margin-top:22px;background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0000000d}
.review-title{font-weight:800;color:#374151;margin-bottom:12px;text-align:center}
.review-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.review-btn{border:1px solid #d1d5db;background:white;color:#4b5563;padding:9px 13px;border-radius:999px;font-weight:700;cursor:pointer}
.review-btn.active{background:#eff6ff;color:#2563eb;border-color:#93c5fd}
.review-btn.correct.active{background:#f0fdf4;color:#15803d;border-color:#86efac}
.review-btn.incorrect.active{background:#fef2f2;color:#dc2626;border-color:#fca5a5}
.review-btn.marked.active{background:#fff7d6;color:#9a6700;border-color:#e5b84b}
.review-note{text-align:center;color:#6b7280;font-size:13px;margin-top:10px}
.practice-panel{min-height:440px;border-radius:28px;background:white;border:1px solid #e5e7eb;box-shadow:0 10px 28px #00000018;padding:28px;display:flex;flex-direction:column;gap:18px}.practice-head{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#64748b;font-weight:750}.practice-question{text-align:center;margin:auto 0}.reading-prompt{font-size:clamp(40px,8vw,68px);font-weight:850;color:#17324d;letter-spacing:.08em}.practice-word{font-size:clamp(34px,7vw,56px);font-weight:850;color:#17324d}.practice-meaning{margin-top:8px;color:#64748b;font-size:17px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.reading-choice{min-height:56px;border:1px solid #cbd5e1;border-radius:14px;background:#fff;color:#1f2937;padding:12px;font:inherit;font-size:19px;font-weight:750;cursor:pointer}.reading-choice.correct{background:#e8f8f0;border-color:#51b889;color:#126447}.reading-choice.wrong{background:#fff0f2;border-color:#db7784;color:#982534}.reading-choice:focus-visible,.kana-chip:focus-visible,.practice-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.reading-result{min-height:54px;border-radius:13px;padding:12px 14px;line-height:1.55;background:#f8fafc;color:#475569}.reading-result.ok{background:#e8f8f0;color:#126447}.reading-result.no{background:#fff0f2;color:#982534}.answer-kana{min-height:66px;border:2px dashed #94a3b8;border-radius:15px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:#f8fafc}.kana-bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.kana-chip{min-width:48px;min-height:48px;border:1px solid #93a9c1;border-radius:12px;background:#eef4fb;color:#17324d;font-size:22px;font-weight:800;cursor:pointer}.kana-chip.used{opacity:.3;pointer-events:none}.practice-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.practice-btn{min-height:46px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#334155;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer}.practice-btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.practice-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}.practice-nav .practice-btn:last-child{justify-self:end}.practice-nav .practice-btn:first-child{justify-self:start}.practice-star{width:48px;height:48px;border-radius:50%;padding:0;font-size:24px;border:2px solid #2563eb;color:#2563eb}.practice-star.active{background:#fff7d6;border-color:#e5b84b;color:#b7791f}
html[data-theme="dark"] .practice-btn.primary{background:#2563eb!important;color:#fff!important;border-color:#60a5fa!important;box-shadow:0 0 0 2px rgba(96,165,250,.2)}

/* Katakana multiple-choice exercise — matches the 擬聲詞／擬態詞 quiz style */
.vocab-quiz-panel{display:none;margin-top:6px}.vocab-quiz-panel.active{display:block}
.quiz-head{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #0000000c}.quiz-head h2{margin:0 0 8px;color:#334155;font-size:25px}.quiz-help{margin:0;color:#64748b;line-height:1.65}.quiz-mode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}.quiz-style-toggle{display:flex;gap:6px;width:max-content;max-width:100%;padding:4px;border:1px solid #dbe3ec;border-radius:11px;background:#eef2f7}.quiz-style-toggle button{min-height:44px;border:0;border-radius:8px;padding:9px 15px;background:transparent;color:#526174;font-weight:800;cursor:pointer}.quiz-style-toggle button.active{background:#2563eb;color:#fff}.instant-random-btn.active{background:#6d28d9;color:#fff;border-color:#8b5cf6}.lesson-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin-top:14px}.lesson-tab{min-height:44px;white-space:nowrap;border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}.lesson-tab.active{background:#2563eb;color:#fff;border-color:#2563eb}.quiz-stats{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;color:#64748b;font-weight:700}.quiz-list{display:grid;gap:14px}.quiz-question{background:#fff;border:1px solid #e2e8f0;border-radius:19px;padding:18px 20px;box-shadow:0 2px 10px #0000000a;transition:.18s}.quiz-question.correct{border-color:#86efac;background:#f0fdf4}.quiz-question.incorrect{border-color:#fca5a5;background:#fff7f7}.q-meta{font-size:13px;color:#64748b;font-weight:750;margin-bottom:8px}.q-text{font-size:18px;line-height:1.75;color:#1f2937;font-weight:700}.quiz-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.quiz-option{min-height:50px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#334155;padding:10px 12px;text-align:left;font:inherit;font-weight:750;cursor:pointer}.quiz-option.selected{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.quiz-question.correct .quiz-option.correct-answer{background:#dcfce7;border-color:#4ade80;color:#166534}.quiz-question.incorrect .quiz-option.correct-answer{background:#dcfce7;border-color:#4ade80;color:#166534}.quiz-question.incorrect .quiz-option.selected:not(.correct-answer){background:#fee2e2;border-color:#f87171;color:#991b1b}.q-feedback{display:none;margin-top:12px;font-weight:800}.quiz-question.correct .q-feedback,.quiz-question.incorrect .q-feedback{display:block}.quiz-question.correct .q-feedback{color:#15803d}.quiz-question.incorrect .q-feedback{color:#dc2626}.vocab-explanation{display:grid;gap:6px;margin-top:12px;padding:13px 14px;border:1px solid #dbe3ec;border-radius:12px;background:#f8fafc;color:#334155;line-height:1.55}.quiz-question .vocab-explanation{display:none}.quiz-question.correct .vocab-explanation,.quiz-question.incorrect .vocab-explanation{display:grid}.quiz-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}.quiz-action{min-height:44px;border:1px solid #cbd5e1;background:#fff;color:#475569;padding:11px 18px;border-radius:11px;font-weight:800;cursor:pointer}.quiz-action.primary{background:#2563eb;color:#fff;border-color:#2563eb}.quiz-action.danger{color:#b91c1c;border-color:#fecaca;background:#fff7f7}.instant-card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:22px;box-shadow:0 3px 14px #0000000c}.instant-question{font-size:21px;line-height:1.7;font-weight:800;color:#1f2937;margin:12px 0 18px}.instant-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.instant-choice{min-height:54px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;color:#334155;padding:11px;font:inherit;font-weight:800;cursor:pointer}.instant-choice.correct{background:#dcfce7;border-color:#4ade80;color:#166534}.instant-choice.wrong{background:#fee2e2;border-color:#f87171;color:#991b1b}.instant-feedback{margin-top:15px;border-radius:13px;padding:12px 14px;font-weight:800}.instant-feedback.correct{background:#f0fdf4;color:#15803d;border:1px solid #86efac}.instant-feedback.wrong{background:#fff7f7;color:#dc2626;border:1px solid #fca5a5}.instant-nav{display:grid;grid-template-columns:1fr auto auto 1fr;gap:8px;align-items:center;margin-top:18px}.instant-nav button:first-child{justify-self:start}.instant-nav button:last-child{justify-self:end}.instant-mark-btn{width:48px;height:48px;border-radius:50%;padding:0;font-size:24px}.instant-mark-btn.active{background:#fff7d6;border-color:#e5b84b;color:#b7791f}.quiz-hidden-source{display:none!important}
html[data-theme="dark"] .quiz-head,html[data-theme="dark"] .quiz-question,html[data-theme="dark"] .instant-card{background:#111c2e;color:#e5edf7;border-color:#334155;box-shadow:none}html[data-theme="dark"] .quiz-head h2,html[data-theme="dark"] .q-text,html[data-theme="dark"] .instant-question{color:#f1f5f9}html[data-theme="dark"] .quiz-help,html[data-theme="dark"] .quiz-stats,html[data-theme="dark"] .q-meta{color:#a9b8ca}html[data-theme="dark"] .lesson-tab,html[data-theme="dark"] .quiz-action,html[data-theme="dark"] .quiz-option,html[data-theme="dark"] .instant-choice{background:#17243a;color:#dce7f3;border-color:#475569}html[data-theme="dark"] .quiz-style-toggle{background:#111c2e;border-color:#334155}html[data-theme="dark"] .quiz-style-toggle button{color:#cbd5e1}html[data-theme="dark"] .quiz-style-toggle button.active{background:#2563eb;color:#fff}html[data-theme="dark"] .quiz-question.correct{background:#12382d;border-color:#237a5c}html[data-theme="dark"] .quiz-question.incorrect{background:#451d28;border-color:#9f3b50}
html[data-theme="dark"] .quiz-option.selected{background:#172d50;color:#bfdbfe;border-color:#60a5fa}
html[data-theme="dark"] .quiz-question.correct .quiz-option.correct-answer,
html[data-theme="dark"] .quiz-question.incorrect .quiz-option.correct-answer,
html[data-theme="dark"] .instant-choice.correct{background:#12382d;color:#a7f3d0;border-color:#237a5c}
html[data-theme="dark"] .quiz-question.incorrect .quiz-option.selected:not(.correct-answer),
html[data-theme="dark"] .instant-choice.wrong{background:#451d28;color:#fecdd3;border-color:#9f3b50}
html[data-theme="dark"] .instant-feedback.correct{background:#12382d;color:#a7f3d0;border-color:#237a5c}
html[data-theme="dark"] .instant-feedback.wrong{background:#451d28;color:#fecdd3;border-color:#9f3b50}
html[data-theme="dark"] .instant-mark-btn.active{background:#4a3914;color:#fde68a;border-color:#d6a72f}
html[data-theme="dark"] .vocab-explanation{background:#17243a;color:#dce7f3;border-color:#475569}
.incorrect-quiz-tab.active{background:#b42332!important;color:#fff!important;border-color:#ef6674!important;box-shadow:0 0 0 2px rgba(239,102,116,.18)!important}
html[data-theme="dark"] .incorrect-quiz-tab.active{background:#651f2b!important;color:#fecdd3!important;border-color:#e05265!important;box-shadow:0 0 0 2px rgba(224,82,101,.2)!important}
@media(max-width:600px){.quiz-options,.instant-choices{grid-template-columns:1fr}.quiz-question{padding:16px}.instant-card{padding:18px 14px}.instant-nav{grid-template-columns:1fr auto auto 1fr;gap:5px}.instant-nav .quiz-action{padding:9px 7px;font-size:12px;white-space:nowrap}.quiz-style-toggle{width:100%}.quiz-style-toggle button{flex:1}}

.hidden{display:none!important}

.reset{display:block;margin:24px auto 0;border:0;background:transparent;color:#6b7280;cursor:pointer;font-size:14px}
@media(max-width:600px){
  .app{padding:18px 12px 30px}
  .card,.card-inner{min-height:410px}
  .card-inner{padding:22px 20px}
  .controls{gap:6px;grid-template-columns:52px minmax(58px,1fr) 48px minmax(58px,1fr) 52px}
  .controls button{min-width:0}.score{width:100%;font-size:17px}.mark-btn{width:48px;height:48px}
  .top{align-items:flex-start}.toolbar{width:100%;display:block}.mode-scroll{width:100%}.mobile-mode-hint{display:block}.choice-grid{grid-template-columns:1fr}.practice-panel{padding:20px 14px;min-height:500px}.practice-actions{gap:7px}.practice-btn{padding:8px 10px}.kana-chip{min-width:46px;min-height:46px}
}

.home-fab{position:fixed;top:16px;left:16px;z-index:999;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.94);color:#17324d;border:1px solid #dbe4ee;text-decoration:none;font-weight:800;box-shadow:0 8px 24px rgba(15,23,42,.14);backdrop-filter:blur(10px);transition:.18s}
.home-fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.2)}
@media(max-width:600px){.home-fab{top:10px;left:10px;padding:9px 12px;font-size:14px}.app{padding-top:64px!important}}

</style>
<script src="theme.js"></script></head>
<body>
<a class="home-fab" href="index.html" aria-label="返回首頁">⌂ <span>首頁</span></a>
<div class="app">
  <div class="top">
    <h1>期終考試生字（69字）</h1>
    <div class="toolbar">
      <div class="mode-scroll"><div class="segment">
        <button id="forwardBtn">正向測試</button>
        <button id="reverseBtn">反向測試</button>
        <button id="readingChoiceBtn">讀音選詞</button>
        <button id="readingBuildBtn">讀音重組</button>
        <button id="spellingQuizBtn">片假名選擇題</button>
      </div></div>
      <button id="shuffleBtn" class="small-btn">隨機模式</button>
    </div>
  </div>
  <div class="mobile-mode-hint">左右滑動查看更多模式</div>

  <div class="status">
    <span id="progressText"></span>
    <span id="saveText">進度會自動保存於此瀏覽器｜Space 翻面</span>
  </div>

  <div id="card" class="card front" role="button" tabindex="0" aria-label="點擊翻面">
    <div class="card-inner">
      <div class="meta">
        <div class="jump-box">
          <input id="jumpInput" class="jump-input" type="number" min="1" inputmode="numeric" aria-label="跳到指定生字">
          <span>/ <span id="totalCount"></span></span>
          <button id="jumpGoBtn" class="jump-go" type="button">前往</button>
        </div>
        <span id="sideBadge" class="badge">點擊翻面</span>
      </div>
      <div id="content" class="center"></div>
      <div id="hint" class="hint">查看答案</div>
    </div>
  </div>

  <section id="practiceArea" class="practice-panel hidden" aria-live="polite"></section>

  <div class="controls" id="flashcardControls">
    <button class="btn circle" id="prevBtn" title="上一題">←</button>
    <button class="btn score bad" id="wrongBtn">✕ <span id="wrongCount">0</span></button>
    <button class="btn mark-btn" id="markBtn" type="button" data-no-swipe aria-label="標記題目" aria-pressed="false">☆</button>
    <button class="btn score good" id="correctBtn"><span id="correctCount">0</span> ✓</button>
    <button class="btn circle" id="nextBtn" title="下一題">→</button>
  </div>
  <div class="review-panel">
    <div class="review-title">重溫已標記題目</div>
    <div class="review-actions">
      <button id="reviewAllBtn" class="review-btn active">全部題目</button>
      <button id="reviewCorrectBtn" class="review-btn correct">✓ 答對</button>
      <button id="reviewIncorrectBtn" class="review-btn incorrect">✕ 答錯</button>
      <button id="reviewMarkedBtn" class="review-btn marked">★ 已標記</button>
    </div>
    <div id="reviewNote" class="review-note"></div>
  </div>
  <section id="spellingQuizPanel" class="vocab-quiz-panel" aria-label="期終考試生字片假名選擇題">
    <div class="quiz-head">
      <h2>期終考試生字・片假名選擇題</h2>
      <p class="quiz-help">根據試卷題目選出正確的片假名寫法。版面和操作方式參照「擬聲詞／擬態詞（選擇題）」，可使用「整課練習」或「即時答題」。</p>
      <div class="quiz-mode-row">
        <div class="quiz-style-toggle" aria-label="選擇題作答方式">
          <button id="vocabBatchBtn" class="active" type="button">整課練習</button>
          <button id="vocabInstantBtn" type="button">即時答題</button>
        </div>
        <button id="vocabRandomBtn" class="quiz-action instant-random-btn" type="button" aria-pressed="false">隨機次序：關</button>
      </div>
      <div class="lesson-tabs">
        <button class="lesson-tab active" data-vocab-lesson="all" type="button">全部</button>
        <button class="lesson-tab" data-vocab-lesson="9" type="button">第9課</button>
        <button class="lesson-tab" data-vocab-lesson="10" type="button">第10課</button>
        <button class="lesson-tab" data-vocab-lesson="11" type="button">第11課</button>
        <button class="lesson-tab" data-vocab-lesson="12" type="button">第12課</button>
        <button id="vocabMarkedBtn" class="lesson-tab" type="button">★ 已標記（0）</button>

: "家事", "read_src": "かじ", "meaning": "家務"}, {"type": "kanji", "word": "都会", "read_src": "とかい", "meaning": "都市、大城市"}, {"type": "kanji", "word": "騒々しい", "read_src": "そうぞうしい", "meaning": "吵鬧、嘈雜"}, {"type": "kanji", "word": "苦労", "read_src": "くろう", "meaning": "辛苦、勞苦"}, {"type": "kanji", "word": "犯人", "read_src": "はんにん", "meaning": "犯人"}, {"type": "kanji", "word": "追いかける", "read_src": "おいかける", "meaning": "追趕、追逐"}, {"type": "kanji", "word": "夜中", "read_src": "よなか", "meaning": "半夜、深夜"}, {"type": "kanji", "word": "含む", "read_src": "ふくむ", "meaning": "包含、包括"}, {"type": "kanji", "word": "住宅地", "read_src": "じゅうたくち", "meaning": "住宅區"}, {"type": "kanji", "word": "穏やか", "read_src": "おだやか", "meaning": "平穩、溫和"}, {"type": "kanji", "word": "暮らしやすい", "read_src": "くらしやすい", "meaning": "容易生活、宜居"}, {"type": "kata", "word": "カルチャーショック", "read_src": "culture shock", "meaning": "文化衝擊", "tip": "注意小字「ッ」同長音「ー」"}, {"type": "kata", "word": "アナウンス", "read_src": "announcement", "meaning": "廣播、通知"}, {"type": "kata", "word": "コマーシャル", "read_src": "commercial", "meaning": "廣告"}, {"type": "kata", "word": "メニュー", "read_src": "menu", "meaning": "菜單、餐牌"}, {"type": "kata", "word": "サンダル", "read_src": "sandal", "meaning": "涼鞋"}];

const el = id => document.getElementById(id);
function filteredIndices() {
  let base = state.order;

  if (state.reviewFilter === "incorrect") return base.filter(i => statuses[i] === "incorrect");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function stableHash(text){let h=2166136261;for(const ch of String(text)){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function deterministicShuffle(list,seed){return [...list].sort((a,b)=>(stableHash(`${seed}|${JSON.stringify(a)}`)-stableHash(`${seed}|${JSON.stringify(b)}`)))}
function similarityScore(a,b){let score=a.type===b.type?20:0;const aw=new Set(Array.from(a.word)),ar=new Set(Array.from(a.reading)),am=new Set(Array.from(a.meaningZh));for(const ch of b.word)if(aw.has(ch))score+=5;for(const ch of b.reading)if(ar.has(ch))score+=3;for(const ch of b.meaningZh)if(am.has(ch))score+=1;return score}
function readingChoiceOptions(correctIndex){const correct=originalList[correctIndex],ranked=originalList.map((item,index)=>({index,item,score:index===correctIndex?-1:similarityScore(correct,item),tie:stableHash(`${correct.id}|${item.id}`)})).filter(x=>x.index!==correctIndex).sort((a,b)=>b.score-a.score||a.tie-b.tie),picked=[correctIndex],labels=new Set([choiceLabel(correct)]);for(const candidate of ranked){const label=choiceLabel(candidate.item);if(labels.has(label))continue;picked.push(candidate.index);labels.add(label);if(picked.length===6)break}return deterministicShuffle(picked,correct.id)}
function choiceLabel(item){return item.type==="kata"?item.meaningZh:item.word}
function confusingKana(ch){const pairs={"け":"げ","げ":"け","か":"が","が":"か","つ":"っ","っ":"つ","し":"じ","じ":"し","き":"ぎ","ぎ":"き","や":"ゃ","ゃ":"や","ゆ":"ゅ","ゅ":"ゆ","よ":"ょ","ょ":"よ","う":"お","お":"う","は":"ば","ば":"ぱ","ぱ":"は"};return pairs[ch]||null}
function kanaBankFor(index){const item=originalList[index],chars=Array.from(item.reading),seed=state.readingBuildSeeds[item.id]||0,extras=[];for(const ch of chars){const alt=confusingKana(ch);if(alt&&!chars.includes(alt)&&!extras.includes(alt))extras.push(alt);if(extras.length>=4)break}const fallback=["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ"];for(const ch of fallback){if(extras.length>=4)break;if(!chars.includes(ch)&&!extras.includes(ch))extras.push(ch)}return deterministicShuffle([...chars.map((char,i)=>({id:`c${i}`,char})),...extras.map((char,i)=>({id:`d${i}`,char}))],`${item.id}|${seed}`)}
function renderReadingPractice(visible){const area=el("practiceArea");if(!visible.length){area.innerHTML='<div class="practice-question"><p>暫時沒有符合這個篩選的題目。</p></div>';return}const index=visible[state.currentPosition],item=originalList[index],marked=!!state.marked[index],head=`<div class="practice-head"><span>${state.mode==="readingChoice"?"讀音選詞":"讀音重組"}</span><span>${state.currentPosition+1} / ${visible.length}</span></div>`;if(state.mode==="readingChoice"){const options=readingChoiceOptions(index),selected=state.readingChoiceSelections[item.id],answered=selected!=null,correct=selected===index;area.innerHTML=`${head}<div class="practice-question"><div class="reading-prompt">${escapeHtml(item.type==="kata"?item.word:item.reading)}</div><div class="practice-meaning">${item.type==="kata"?"選擇正確中文意思":"選擇正確詞彙"}</div></div><div class="choice-grid">${options.map(optionIndex=>{const option=originalList[optionIndex],cls=answered?(optionIndex===index?" correct":optionIndex===selected?" wrong":""):"";return `<button class="reading-choice${cls}" data-no-swipe onclick="chooseReading(${optionIndex})" ${answered?"disabled":""}>${escapeHtml(choiceLabel(option))}</button>`}).join("")}</div><div class="reading-result ${answered?(correct?"ok":"no"):""}">${answered?`${correct?"✓ 正確":"✕ 答錯"}<br><b>${escapeHtml(item.word)}</b>｜${escapeHtml(item.reading)}｜${escapeHtml(item.meaningZh)}`:"請選擇答案。"}</div>${practiceNavigation(marked)}`;return}const bank=kanaBankFor(index),selectedIds=state.readingBuildSelections[item.id]||[],selectedChars=selectedIds.map(id=>bank.find(x=>x.id===id)).filter(Boolean),status=state.readingBuildStatus[index];area.innerHTML=`${head}<div class="practice-question"><div class="practice-word">${escapeHtml(item.word)}</div><div class="practice-meaning">${escapeHtml(item.meaningZh)}</div></div><div class="answer-kana" data-no-swipe>${selectedChars.length?selectedChars.map((x,i)=>`<button class="kana-chip" data-no-swipe onclick="removeSelectedKana(${i})">${escapeHtml(x.char)}</button>`).join(""):"點選下方假名組成讀音"}</div><div class="kana-bank" data-no-swipe>${bank.map(x=>`<button class="kana-chip ${selectedIds.includes(x.id)?"used":""}" data-no-swipe onclick="addKana('${x.id}')">${escapeHtml(x.char)}</button>`).join("")}</div><div class="practice-actions"><button class="practice-btn" data-no-swipe onclick="reshuffleKana()">重新排列</button><button class="practice-btn" data-no-swipe onclick="clearKana()">清除答案</button><button class="practice-btn primary" data-no-swipe onclick="checkKana()">檢查答案</button></div><div class="reading-result ${status?(status==="correct"?"ok":"no"):""}">${status?(status==="correct"?"✓ 正確":"✕ 答錯，正確讀音："+escapeHtml(item.reading)):"請按正確次序選擇假名。"}</div>${practiceNavigation(marked)}`}
function practiceNavigation(marked){return `<div class="practice-nav"><button class="practice-btn" data-no-swipe onclick="prev()">← 上一題</button><button class="practice-btn practice-star ${marked?"active":""}" data-no-swipe aria-label="標記題目" aria-pressed="${marked}" onclick="togglePracticeMark()">${marked?"★":"☆"}</button><button class="practice-btn" data-no-swipe onclick="next()">下一題 →</button></div>`}
function currentReadingContext(){const list=filteredIndices();if(!list.length)return null;const index=list[state.currentPosition];return{list,index,item:originalList[index]}}
function chooseReading(optionIndex){const c=currentReadingContext();if(!c)return;state.readingChoiceSelections[c.item.id]=optionIndex;state.readingChoiceStatus[c.index]=optionIndex===c.index?"correct":"incorrect";save();render()}
function addKana(id){const c=currentReadingContext();if(!c)return;const selected=state.readingBuildSelections[c.item.id]||(state.readingBuildSelections[c.item.id]=[]);if(!selected.includes(id)){selected.push(id);delete state.readingBuildStatus[c.index]}save();render()}
function removeSelectedKana(position){const c=currentReadingContext();if(!c)return;(state.readingBuildSelections[c.item.id]||[]).splice(position,1);delete state.readingBuildStatus[c.index];save();render()}
function clearKana(){const c=currentReadingContext();if(!c)return;state.readingBuildSelections[c.item.id]=[];delete state.readingBuildStatus[c.index];save();render()}

function next() {
  state.retainedMarkedIndex = null;
  const list = filteredIndices();
  state.isFlipped = false;
  if (list.length) state.currentPosition = (state.currentPosition + 1) % list.length;
  syncModePosition();
  render();
}
function prev() {
  state.retainedMarkedIndex = null;
  const list = filteredIndices();
  state.isFlipped = false;
  if (list.length) state.currentPosition = (state.currentPosition - 1 + list.length) % list.length;
  syncModePosition();
  render();
}
function reshuffle() {
  const a = originalList.map((_, i) => i);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  state.order = a;
  state.currentPosition = 0;
}

  state.statuses[idx] = "correct";

  next();
};

function jumpToVocabulary() {

document.addEventListener("keydown", e => {
  const tag = document.activeElement?.tagName;
  const isControl = ["BUTTON","INPUT","TEXTAREA","SELECT"].includes(tag);
  if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
  else if ((e.key === " " || e.code === "Space") && !isControl && (state.mode==="forward"||state.mode==="reverse")) {
    e.preventDefault();
    state.isFlipped = !state.isFlipped;
    render();
  } else if (e.key.toLowerCase() === "f" && (state.mode==="forward"||state.mode==="reverse")) {
    state.isFlipped = !state.isFlipped;
    render();
  }
});

el('vocabIncorrectBtn').onclick=()=>{vocabQuiz.incorrectOnly=!vocabQuiz.incorrectOnly;if(vocabQuiz.incorrectOnly)vocabQuiz.markedOnly=false;vocabQuiz.instantPos=0;vocabQuiz.checked=false;saveVocabQuiz();renderVocabQuiz()};
el('vocabCheckBtn').onclick=()=>{vocabQuiz.checked=true;renderVocabQuiz();document.querySelector('.quiz-question.incorrect')?.scrollIntoView({behavior:'smooth',block:'center'})};
el('vocabClearBtn').onclick=()=>{vocabBaseQuestions().forEach(q=>delete vocabQuiz.answers[q.id]);vocabQuiz.checked=false;saveVocabQuiz();renderVocabQuiz()};

render();
</script>
</body>
</html>
